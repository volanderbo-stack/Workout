}
function updateNav() {
  const active = route.name === 'home' ? 'home' : route.name === 'favorites' ? 'fav'
    : ['programs', 'program', 'run'].includes(route.name) ? 'prog'
    : ['my', 'routine', 'edit', 'workout', 'history', 'historyItem', 'calendar', 'data', 'shared'].includes(route.name) ? 'my' : 'ex';
  $('#navHome').innerHTML = ICON.house + '<span>Головна</span>';
  $('#navEx').innerHTML = ICON.list + '<span>Вправи</span>';
  $('#navMy').innerHTML = ICON.gym + '<span>Мої</span>';
  const showBar = !!state.active && route.name !== 'workout';
  $('#activeBar').hidden = !showBar;
  document.body.classList.toggle('has-active', showBar);
  tickClock();
  $('#navProg').innerHTML = ICON.prog + '<span>Комплекси</span>';
  $('#navFav').innerHTML = ICON.star + `<span>Обране</span><i class="nav-badge">${(state.favs.length + state.favPrograms.length) || ''}</i>`;
  $('#navEx').href = '#/' + state.place + '/all';
  document.querySelectorAll('.bottom-nav a').forEach(a => {
    const on = a.dataset.nav === active;
    a.classList.toggle('on', on);
    if (on) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current');
  });
}

/* =====================================================================
   МОЇ ТРЕНУВАННЯ (у стилі Hevy)
   Шаблони за розподілом (ноги, плечі, груди, спина…), журнал підходів
   з вагою й повтореннями, «минулого разу», рекорди та історія.
   Усе зберігається в localStorage: state.routines, state.active, state.history.
   ===================================================================== */
const BLOCKS = [['legs', 'Ноги'], ['shoulders', 'Плечі'], ['chest', 'Груди'], ['back', 'Спина'], ['arms', 'Руки'], ['full', 'Інше / все тіло']];
const GROUP_BLOCK = { legs: 'legs', shoulders: 'shoulders', traps: 'shoulders', chest: 'chest', back: 'back', biceps: 'arms', triceps: 'arms', forearms: 'arms', abs: 'full' };
const REST_OPTIONS = [0, 30, 45, 60, 75, 90, 105, 120, 150, 180, 240, 300];
ICON.up = svg('<path d="M12 19V5M6 11l6-6 6 6"/>');
ICON.down = svg('<path d="M12 5v14M6 13l6 6 6-6"/>');

const blockName = id => (BLOCKS.find(b => b[0] === id) || BLOCKS[5])[1];
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const routineById = id => state.routines.find(r => r.id === id);
const toNum = v => { const n = parseFloat(String(v).replace(',', '.')); return Number.isFinite(n) ? n : null; };
const firstInt = s => { const m = String(s || '').match(/\d+/); return m ? +m[0] : null; };
const fmtKg = n => (Math.round(n * 10) / 10).toLocaleString('uk-UA');
const restLabel = s => !s ? 'Вимк.' : s < 60 ? s + ' с' : fmtClock(s);
const restOptions = cur => [...new Set([...REST_OPTIONS, cur])].sort((a, b) => a - b)
  .map(s => `<option value="${s}" ${s === cur ? 'selected' : ''}>${restLabel(s)}</option>`).join('');

function guessBlock(ids) {
  const cnt = {};
  ids.forEach(id => { const b = GROUP_BLOCK[byId[id].muscleGroup] || 'full'; cnt[b] = (cnt[b] || 0) + 1; });
  const top = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
  return top ? top[0] : 'full';
}
function routineItem(e) {
  const r = recFor(e);
  return { exerciseId: e.id, sets: firstInt(r.sets) || 3, reps: e.unit === 'sec' ? String(holdSecFor(e)) : r.reps, rest: restSecFor(e), note: '' };
}
function fmtDate(ts) {
  const d = new Date(ts);
  return d.toLocaleDateString('uk-UA', { weekday: 'short', day: 'numeric', month: 'short' }) + ' · ' +
    d.toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
}
function fmtDur(ms) {
  const m = Math.max(1, Math.round(ms / 60000));
  return m < 60 ? m + ' хв' : Math.floor(m / 60) + ' год ' + String(m % 60).padStart(2, '0') + ' хв';
}
function fmtElapsed(ms) {
  const s = Math.max(0, Math.floor(ms / 1000)), h = Math.floor(s / 3600);
  return (h ? h + ':' + String(Math.floor(s % 3600 / 60)).padStart(2, '0') : Math.floor(s / 60)) + ':' + String(s % 60).padStart(2, '0');
}
const histVolume = h => h.exercises.reduce((s, x) => s + x.sets.reduce((a, st) => a + (st.kg || 0) * (st.reps || 0), 0), 0);
const histSets = h => h.exercises.reduce((s, x) => s + x.sets.length, 0);
// Історія зберігається від нових до старих
function lastSetsFor(exId, beforeTs = Infinity) {
  for (const h of state.history) {
    if (h.startedAt >= beforeTs) continue;
    const x = h.exercises.find(y => y.exerciseId === exId);
    if (x) return x.sets;
  }
  return null;
}
function bestKg(exId, beforeTs = Infinity) {
  let best = null;
  for (const h of state.history) {
    if (h.startedAt >= beforeTs) continue;
    for (const x of h.exercises) if (x.exerciseId === exId) for (const s of x.sets) if (s.kg && (best === null || s.kg > best)) best = s.kg;
  }
  return best;
}
const prevLine = sets => sets.map(s => s.kg ? `${fmtKg(s.kg)}×${s.reps}` : `${s.reps}`).join(', ');

// logDate — якщо тренування записують заднім числом (з календаря): дата, на яку його збережуть
function newActive(title, routineId, block, items, logDate = null) {
  return {
    id: uid(), routineId: routineId || null, title, block: block || 'full', startedAt: Date.now(), logDate,
    exercises: items.map(it => ({ exerciseId: it.exerciseId, reps: it.reps, rest: it.rest, note: it.note || '',
      sets: Array.from({ length: it.sets }, () => ({ kg: '', reps: '', done: false })) }))
  };
}
function activeStats(a) {
  let vol = 0, done = 0;
  a.exercises.forEach(x => x.sets.forEach(s => { if (s.done) { done++; vol += (toNum(s.kg) || 0) * (toNum(s.reps) || 0); } }));
  return { vol, done };
}
function structureChanged(a, r) {
  return a.exercises.length !== r.exercises.length || a.exercises.some((x, i) =>
    x.exerciseId !== r.exercises[i].exerciseId || x.sets.length !== r.exercises[i].sets || x.rest !== r.exercises[i].rest);
}
function tickClock() {
  if (!state.active) return;
  const t = fmtElapsed(Date.now() - state.active.startedAt);
  document.querySelectorAll('[data-elapsed]').forEach(el => { el.textContent = t; });
}
setInterval(tickClock, 1000);

function confirmModal(title, text, yesLabel, onYes, noLabel = 'Скасувати', onNo = null, danger = false) {
  ui.confirm = { yes: onYes, no: onNo };
  openModal(`<h3>${title}</h3><p class="sub">${text}</p>
    <button class="btn ${danger ? 'danger' : ''}" data-act="confirm-yes">${yesLabel}</button>
    <button class="btn secondary" style="margin-top:8px" data-act="confirm-no">${noLabel}</button>`);
}
function startWorkout(title, routineId, block, items, logDate = null) {
  const go = () => {
    cancelTimer();
    state.active = newActive(title, routineId, block, items, logDate);
    saveState();
    location.hash = '#/workout';
  };
  if (state.active) {
    confirmModal('Незавершене тренування', `«${esc(state.active.title)}» ще триває. Почати нове — означає скасувати його без збереження.`,
      'Скасувати його й почати нове', go, 'Продовжити поточне', () => { location.hash = '#/workout'; }, true);
  } else go();
}
function openDraft(draft) {
  ui.draft = draft;
  location.hash = '#/edit';
}

function routineCard(r) {
  const last = state.history.find(h => h.routineId === r.id);
  const names = r.exercises.map(x => byId[x.exerciseId].name);
  return `<a class="prog-card" href="#/routine/${r.id}">
    <span class="prog-ico">${ICON.gym}</span>
    <span class="prog-text"><b>${esc(r.name)}</b>
      <span>${r.exercises.length} ${exWord(r.exercises.length)} · ${esc(names.slice(0, 3).join(', '))}${names.length > 3 ? '…' : ''}</span>
      ${last ? `<span>Останнє: ${fmtDate(last.startedAt)}</span>` : ''}</span>${ICON.chev}</a>`;
}
function histCard(h) {
  const gs = groupsOf(h);
  return `<a class="prog-card" href="#/history/${h.id}">
    <span class="prog-ico">${ICON.check}</span>
    <span class="prog-text"><b>${esc(h.title)}</b><span>${fmtDate(h.startedAt)}</span>
      <span class="gdots">${gs.map(g => `<i style="--c:var(--g-${g.id})"></i>${esc(groupById[g.id].name)}`).join(' ')}</span>
      <span>${fmtDur(h.endedAt - h.startedAt)} · ${fmtKg(histVolume(h))} кг · ${histSets(h)} ${setWord(histSets(h))}${h.prs ? ` · рекордів: ${h.prs}` : ''}</span></span>${ICON.chev}</a>`;
}

/* ---------- Вибір вправ (модальне вікно) ---------- */
function openPicker(target) {

/* ---------- Журнал: одна вправа ---------- */
function logExHtml(a, x, i) {
  const e = byId[x.exerciseId];
  const timed = e.unit === 'sec';
  const prev = lastSetsFor(e.id, a.logDate || a.startedAt) || [];
  const best = bestKg(e.id, a.logDate || a.startedAt);
  const rows = x.sets.map((s, j) => {
    const p = prev[j];
    const above = j ? x.sets[j - 1] : null;
    const phKg = p && p.kg ? fmtKg(p.kg) : above && above.kg ? above.kg : '';
    const phReps = p ? p.reps : above && above.reps ? above.reps : (firstInt(x.reps) || '');
    const pr = s.done && best !== null && toNum(s.kg) > best;
    return `<tr class="${s.done ? 'done' : ''}">
      <td class="set-num">${j + 1}${pr ? '<div class="pr">PR</div>' : ''}</td>
      <td class="set-prev">${p ? (p.kg ? fmtKg(p.kg) + ' × ' + p.reps : p.reps) : '—'}</td>
      <td><input inputmode="decimal" data-log="kg" data-i="${i}" data-j="${j}" value="${esc(s.kg)}" placeholder="${esc(phKg)}" aria-label="Вага, кг, підхід ${j + 1}"></td>
      <td><input inputmode="numeric" data-log="reps" data-i="${i}" data-j="${j}" value="${esc(s.reps)}" placeholder="${esc(phReps)}" aria-label="${timed ? 'Секунди' : 'Повторення'}, підхід ${j + 1}"></td>
      <td><button class="set-check" data-act="log-done" data-i="${i}" data-j="${j}" aria-pressed="${s.done}" aria-label="Підхід ${j + 1} виконано">${ICON.check}</button></td>
    </tr>`;
  }).join('');
  return `<section class="log-ex">
    <div class="log-ex-head">
      <div class="thumb">${thumbImg(e)}</div>
      <a href="#/exercise/${e.id}"><b>${esc(e.name)}</b><span class="ex-muscles">${esc(e.aka || subName(e))}</span></a>
      <button class="icon-btn" data-act="log-remove-ex" data-i="${i}" aria-label="Прибрати вправу">${ICON.x}</button>
    </div>
    ${x.note ? `<p class="log-note">${esc(x.note)}</p>` : ''}
    <div class="log-meta"><span>Ціль: ${esc(x.reps)}${timed ? ' с' : ''}</span>
      <label>${ICON.timer}<select data-log="rest" data-i="${i}" aria-label="Відпочинок між підходами">${restOptions(x.rest)}</select></label></div>
    <table class="set-table">
      <thead><tr><th>№</th><th>Минулого</th><th>кг</th><th>${timed ? 'Сек' : 'Повт'}</th><th aria-label="Виконано">✓</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    <div class="log-actions">
      <button class="btn small secondary" data-act="log-add-set" data-i="${i}">${ICON.plus} Підхід</button>
      ${x.sets.length > 1 ? `<button class="btn small secondary" data-act="log-del-set" data-i="${i}">${ICON.minus} Підхід</button>` : ''}
    </div>
  </section>`;
}
function updateLogStats() {
  const st = activeStats(state.active);
  const v = $('#logVol'), s = $('#logSets');
  if (v) v.textContent = fmtKg(st.vol) + ' кг';
  if (s) s.textContent = st.done;

  workout() {

    const st = activeStats(a);

      head: topbar({ title: a.title, back: true, action: '<button class="btn small" data-act="log-finish">Завершити</button>' }),
      body: `
        ${a.logDate ? `<p class="note-box">${ICON.cal} Запис за <b>${dayTitle(a.logDate)}</b> — тренування збережеться в календарі на цю дату.</p>` : ''}
        <div class="log-head">
          <div class="log-stat"><b data-elapsed>${fmtElapsed(Date.now() - a.startedAt)}</b><span>Тривалість</span></div>
          <div class="log-stat"><b id="logVol">${fmtKg(st.vol)} кг</b><span>Обсяг</span></div>
          <div class="log-stat"><b id="logSets">${st.done}</b><span>Підходів</span></div>
        </div>
        ${a.exercises.map((x, i) => logExHtml(a, x, i)).join('') || '<p class="muted-line" style="margin-top:16px">Додай першу вправу.</p>'}
        <button class="btn secondary" style="margin-top:16px" data-act="pick-open" data-target="active">${ICON.plus} Додати вправу</button>
        <button class="link-btn danger" data-act="log-discard">Скасувати тренування</button>`

  history() {
    const weekAgo = Date.now() - 7 * 864e5;
    const wk = state.history.filter(h => h.startedAt > weekAgo);

      head: topbar({ title: 'Історія', back: true }),
      body: state.history.length ? `
        <div class="row-btns" style="margin-top:8px">
          <a class="btn secondary" href="#/calendar">${ICON.cal} Календар</a>

        </div>
        <div class="stats" style="margin-top:12px">
          <div class="stat"><b>${wk.length}</b><span>за 7 днів</span></div>

          <div class="stat"><b>${state.history.length}</b><span>усього</span></div>

        <div class="prog-list" style="margin-top:12px">${state.history.map(histCard).join('')}</div>`

  historyItem(rt) {

              <tbody>${x.sets.map((s, j) => `<tr><td class="set-num">${j + 1}${s.pr ? '<div class="pr">PR</div>' : ''}</td>
                <td>${s.kg ? fmtKg(s.kg) + ' кг' : '—'}</td><td>${s.reps}</td><td class="set-prev">${s.kg ? fmtKg(s.kg * s.reps) : '—'}</td></tr>`).join('')}</tbody>

/* ---------- Дії «Моїх тренувань» ---------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const id = t.dataset.id;
  const i = +t.dataset.i, j = +t.dataset.j;
  const a = state.active;
  switch (t.dataset.act) {
    case 'confirm-yes':
    case 'confirm-no': {
      const f = ui.confirm && ui.confirm[t.dataset.act === 'confirm-yes' ? 'yes' : 'no'];
      ui.confirm = null;
      closeModal();
      if (f) f();
      break;
    }

    /* шаблони */
    case 'my-new': openDraft({ id: null, name: '', block: t.dataset.block || 'legs', exercises: [] }); break;
    case 'my-from-favs': {
      const ids = state.favs.filter(x => byId[x]);
      if (!ids.length) break;
      const block = guessBlock(ids);
      openDraft({ id: null, name: blockName(block) + ' — моє тренування', block, exercises: ids.map(x => routineItem(byId[x])) });
      break;
    }
    case 'my-from-prog': {
      const p = progById[id];
      const items = progItems(p);
      openDraft({ id: null, name: p.title, block: guessBlock(items.map(x => x.exerciseId)),
        exercises: items.map(x => ({ exerciseId: x.exerciseId, sets: x.sets, reps: x.reps, rest: x.rest || 60, note: x.note || '' })) });
      break;
    }
    case 'my-edit': {
      const r = routineById(id);
      if (r) openDraft(JSON.parse(JSON.stringify(r)));
      break;
    }
    case 'my-dup': {
      const r = routineById(id);
      const copy = { ...JSON.parse(JSON.stringify(r)), id: uid(), name: r.name + ' (копія)', createdAt: Date.now() };
      state.routines.push(copy);
      saveState();
      location.hash = '#/routine/' + copy.id;
      break;
    }
    case 'my-del': {
      const r = routineById(id);
      confirmModal('Видалити тренування?', `Шаблон «${esc(r.name)}» буде видалено. Історія виконаних тренувань залишиться.`, 'Видалити', () => {
        state.routines = state.routines.filter(x => x.id !== id);
        saveState();
        location.replace('#/my');
      }, 'Скасувати', null, true);
      break;
    }
    case 'my-start': {
      const r = routineById(id);
      startWorkout(r.name, r.id, r.block, r.exercises);
      break;
    }
    case 'my-empty': startWorkout('Тренування', null, 'full', []); break;
    case 'my-repeat': {
      const h = state.history.find(x => x.id === id);
      const r = h && routineById(h.routineId);
      if (r) startWorkout(r.name, r.id, r.block, r.exercises);
      else startWorkout(h.title, null, h.block, h.exercises.map(x => ({ exerciseId: x.exerciseId, sets: x.sets.length, reps: String(x.sets[0].reps), rest: restSecFor(byId[x.exerciseId]) })));
      break;
    }
    case 'hist-del':
      confirmModal('Видалити запис?', 'Тренування зникне з історії та з колонки «Минулого».', 'Видалити', () => {
        state.history = state.history.filter(x => x.id !== id);
        saveState();
        location.replace('#/history');
      }, 'Скасувати', null, true);
      break;
    case 'my-add-ex': {
      const e = byId[id];
      ui.modal = 'add-ex';
      openModal(`<h3>Додати в тренування</h3><p class="sub">${esc(e.name)}</p>
        ${a ? `<button class="btn" data-act="my-add-to" data-rid="active" data-id="${id}">${ICON.play} У поточне: ${esc(a.title)}</button>` : ''}
        <div class="prog-list" style="margin-top:10px">${state.routines.map(r => `<button class="row-link" style="margin-top:0" data-act="my-add-to" data-rid="${r.id}" data-id="${id}">${ICON.gym}<span class="grow">${esc(r.name)}<small>${blockName(r.block)} · ${r.exercises.length} ${exWord(r.exercises.length)}</small></span>${ICON.plus}</button>`).join('')}</div>
        <button class="btn secondary" style="margin-top:10px" data-act="my-new-with" data-id="${id}">${ICON.plus} Нове тренування з цією вправою</button>
        <button class="link-btn" data-act="modal-close">Скасувати</button>`);
      break;
    }
    case 'my-add-to': {
      const e = byId[id];
      const it = routineItem(e);
      if (t.dataset.rid === 'active') {
        a.exercises.push({ exerciseId: e.id, reps: it.reps, rest: it.rest, note: '', sets: Array.from({ length: it.sets }, () => ({ kg: '', reps: '', done: false })) });
        saveState();
        closeModal();
        location.hash = '#/workout';
        break;
      }
      const r = routineById(t.dataset.rid);
      r.exercises.push(it);
      r.updatedAt = Date.now();
      saveState();
      openModal(`<h3>Додано</h3><p class="sub">«${esc(e.name)}» тепер у тренуванні «${esc(r.name)}».</p>
        <a class="btn" href="#/routine/${r.id}" data-act="modal-close">Відкрити тренування</a>
        <button class="btn secondary" style="margin-top:8px" data-act="modal-close">Готово</button>`);
      break;
    }
    case 'my-new-with': {
      const e = byId[id];
      closeModal();
      const block = guessBlock([id]);
      openDraft({ id: null, name: '', block, exercises: [routineItem(e)] });
      break;
    }

    /* редактор */
    case 'ed-move': {
      const d = ui.draft, k = i + +t.dataset.d;
      [d.exercises[i], d.exercises[k]] = [d.exercises[k], d.exercises[i]];
      render(true);
      break;
    }
    case 'ed-del': ui.draft.exercises.splice(i, 1); render(true); break;
    case 'ed-save': {
      const d = ui.draft;
      const err = $('#edErr');
      if (!d.exercises.length) { err.textContent = 'Додай хоча б одну вправу.'; err.hidden = false; break; }
      d.name = d.name.trim() || blockName(d.block) + ' — тренування';
      d.exercises.forEach(x => { x.reps = String(x.reps || '').trim() || '8–12'; });
      if (d.id && routineById(d.id)) {
        state.routines = state.routines.map(r => r.id === d.id ? { ...d, updatedAt: Date.now() } : r);
      } else {
        d.id = uid();
        d.createdAt = Date.now();
        state.routines.push(d);
      }
      saveState();
      ui.draft = null;
      location.replace('#/routine/' + d.id);
      break;
    }

    /* вибір вправ */
    case 'pick-open': openPicker(t.dataset.target); break;
    case 'pick-group': ui.pick.group = t.dataset.v; pickChips(); pickList(); break;
    case 'pick-toggle': {
      const sel = ui.pick.sel, k = sel.indexOf(id);
      if (k >= 0) sel.splice(k, 1); else sel.push(id);
      t.classList.toggle('on', k < 0);
      t.setAttribute('aria-pressed', k < 0);
      pickButton();
      break;
    }
    case 'pick-add': {
      const items = ui.pick.sel.map(x => routineItem(byId[x]));
      if (ui.pick.target === 'draft') ui.draft.exercises.push(...items);
      else if (a) {
        a.exercises.push(...items.map(it => ({ exerciseId: it.exerciseId, reps: it.reps, rest: it.rest, note: '',
          sets: Array.from({ length: it.sets }, () => ({ kg: '', reps: '', done: false })) })));
        saveState();
      }
      closeModal();
      render(true);
      break;
    }

    /* журнал тренування */
    case 'log-done': {
      const x = a.exercises[i], s = x.sets[j];
      if (s.done) { s.done = false; saveState(); render(true); break; }
      // Порожні поля беремо з підказок (минулий раз / попередній підхід), як у Hevy
      const row = t.closest('tr');
      const kgIn = row.querySelector('[data-log="kg"]'), rIn = row.querySelector('[data-log="reps"]');
      if (s.kg === '' && kgIn.placeholder) s.kg = kgIn.placeholder;
      if (s.reps === '' && rIn.placeholder) s.reps = rIn.placeholder;
      if (toNum(s.reps) === null) { rIn.classList.add('need'); rIn.focus(); break; }
      s.done = true;
      saveState();
      render(true);
      const left = x.sets.findIndex(z => !z.done);
      const nextEx = a.exercises.slice(i + 1).find(z => z.sets.some(q => !q.done));
      if (x.rest > 0 && (left >= 0 || nextEx)) {
        startTimer('rest', x.rest, 'log', { name: byId[x.exerciseId].name,
          next: left >= 0 ? `Далі: підхід ${left + 1} з ${x.sets.length}` : `Далі: ${byId[nextEx.exerciseId].name}` });
      }
      break;
    }
    case 'log-add-set': {
      const x = a.exercises[i];
      x.sets.push({ kg: '', reps: '', done: false });
      saveState();
      render(true);
      break;
    }
    case 'log-del-set': a.exercises[i].sets.pop(); saveState(); render(true); break;
    case 'log-remove-ex':
      confirmModal('Прибрати вправу?', `«${esc(byId[a.exercises[i].exerciseId].name)}» та її підходи зникнуть із цього тренування.`, 'Прибрати', () => {
        a.exercises.splice(i, 1);
        saveState();
        render(true);
      }, 'Скасувати', null, true);
      break;
    case 'log-discard':
      confirmModal('Скасувати тренування?', 'Усі записані підходи цього тренування буде втрачено.', 'Скасувати тренування', () => {
        state.active = null;
        cancelTimer();
        saveState();
        location.replace('#/my');
      }, 'Продовжити тренування', null, true);
      break;
    case 'log-finish': {
      const st = activeStats(a);
      if (!st.done) {
        confirmModal('Немає виконаних підходів', 'Познач підходи галочкою ✓ або скасуй тренування.', 'Скасувати тренування', () => {
          state.active = null; cancelTimer(); saveState(); location.replace('#/my');
        }, 'Продовжити', null, true);
        break;
      }
      const undone = a.exercises.reduce((n, x) => n + x.sets.filter(s => !s.done).length, 0);
      const r = a.routineId && routineById(a.routineId);
      ui.modal = 'finish';
      openModal(`<h3>Завершити тренування?</h3>
        <p class="sub">${fmtElapsed(Date.now() - a.startedAt)} · ${st.done} ${setWord(st.done)} · ${fmtKg(st.vol)} кг</p>
        ${undone ? `<p class="note-box">Невиконані підходи (${undone}) не збережуться.</p>` : ''}
        ${!r ? `<label class="check" style="margin-top:12px"><input type="checkbox" id="saveAsRoutine" ${a.exercises.length ? 'checked' : ''}> Зберегти як шаблон у «Мої тренування»</label>`
          : structureChanged(a, r) ? `<label class="check" style="margin-top:12px"><input type="checkbox" id="updRoutine" checked> Оновити шаблон «${esc(r.name)}»</label>` : ''}
        <button class="btn" style="margin-top:16px" data-act="log-save">${ICON.check} Зберегти тренування</button>
        <button class="btn secondary" style="margin-top:8px" data-act="modal-close">Продовжити тренування</button>`);
      break;
    }
    case 'log-save': {
      const exs = a.exercises.map(x => ({ exerciseId: x.exerciseId,
        sets: x.sets.filter(s => s.done).map(s => ({ kg: toNum(s.kg) || 0, reps: toNum(s.reps) || 0 })) })).filter(x => x.sets.length);
      let prs = 0;
      exs.forEach(x => {
        const best = bestKg(x.exerciseId, a.logDate || a.startedAt);
        if (best === null) return;
        x.sets.forEach(s => { if (s.kg > best) s.pr = true; });
        if (x.sets.some(s => s.pr)) prs++;
      });
      const dur = Date.now() - a.startedAt;
      const startedAt = a.logDate || a.startedAt;
      const h = { id: a.id, routineId: a.routineId, title: a.title, block: a.block, startedAt, endedAt: startedAt + dur, exercises: exs, prs };
      const toTemplate = () => a.exercises.map(x => ({ exerciseId: x.exerciseId, sets: x.sets.length, reps: x.reps, rest: x.rest, note: x.note || '' }));
      const upd = $('#updRoutine'), sav = $('#saveAsRoutine');
      if (upd && upd.checked) {
        const r = routineById(a.routineId);
        r.exercises = toTemplate();
        r.updatedAt = Date.now();
      }
      if (sav && sav.checked) {
        const block = guessBlock(a.exercises.map(x => x.exerciseId));
        const r = { id: uid(), name: a.title === 'Тренування' ? blockName(block) + ' — тренування' : a.title, block, exercises: toTemplate(), createdAt: Date.now() };
        state.routines.push(r);
        h.routineId = r.id;
        h.title = r.name;
        h.block = block;
      }
      state.history.unshift(h);
      state.history.sort((x, y) => y.startedAt - x.startedAt);
      if (state.history.length > 500) state.history.length = 500;
      state.active = null;
      cancelTimer();
      saveState();
      closeModal();
      ui.justSaved = h.id;
      location.replace('#/history/' + h.id);
      break;
    }
  }
});
// Поля журналу та редактора: зберігаємо без перерендеру, щоб не губити фокус
function onFieldEdit(ev) {
  const t = ev.target;
  if (t.dataset.log && state.active) {
    const x = state.active.exercises[+t.dataset.i];
    if (!x) return;
    if (t.dataset.log === 'rest') x.rest = +t.value;
    else {
      x.sets[+t.dataset.j][t.dataset.log] = t.value.trim();

      x[k] = k === 'sets' || k === 'rest' ? +t.value : t.value;
    }
  }
}

/* =====================================================================
   КАЛЕНДАР ІСТОРІЇ: які групи м'язів і коли пропрацьовано.
   Групи рахуються з вправ тренування (а не з назви), тож тренування
   «груди + трицепс» або «ноги + прес» показує обидві групи з кількістю підходів.
   ===================================================================== */
const dayKey = ts => {
  const d = new Date(ts);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
};
const keyTs = (k, hour = 12) => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d, hour).getTime(); };
const dayTitle = ts => new Date(ts).toLocaleDateString('uk-UA', { weekday: 'long', day: 'numeric', month: 'long' });
const gColor = id => `--c:var(--g-${id})`;

// Групи м'язів одного тренування, від найбільшої кількості підходів
function groupsOf(h) {
  const m = {};
  h.exercises.forEach(x => { const g = byId[x.exerciseId].muscleGroup; m[g] = (m[g] || 0) + x.sets.length; });
  return Object.entries(m).map(([id, sets]) => ({ id, sets })).sort((a, b) => b.sets - a.sets);
}
// Групи за кілька тренувань (день, місяць)
function groupsOfMany(hs) {
  const m = {};
  hs.forEach(h => groupsOf(h).forEach(g => { m[g.id] = (m[g.id] || 0) + g.sets; }));
  return Object.entries(m).map(([id, sets]) => ({ id, sets })).sort((a, b) => b.sets - a.sets);
}
function historyByDay() {
  const m = {};
  state.history.forEach(h => { const k = dayKey(h.startedAt); (m[k] = m[k] || []).push(h); });
  Object.values(m).forEach(list => list.sort((a, b) => a.startedAt - b.startedAt));
  return m;
}
function monthGroupStats(hs) {
  const st = {};
  hs.forEach(h => {
    const seen = new Set();
    h.exercises.forEach(x => {
      const e = byId[x.exerciseId], g = e.muscleGroup;
      const s = st[g] = st[g] || { sets: 0, workouts: 0, ex: {} };
      s.sets += x.sets.length;
      if (!seen.has(g)) { s.workouts++; seen.add(g); }
      const ee = s.ex[e.id] = s.ex[e.id] || { sets: 0, times: 0, best: null };
      ee.sets += x.sets.length;
      ee.times++;
      x.sets.forEach(q => { if (q.kg && (!ee.best || q.kg > ee.best.kg || (q.kg === ee.best.kg && q.reps > ee.best.reps))) ee.best = q; });
    });
  });
  return st;
}

function dayPanel(key, hs) {
  const todayK = dayKey(Date.now());
  const ts = keyTs(key);
  const canLog = key <= todayK;
  const cards = (hs || []).map(h => {

    const time = new Date(h.startedAt).toLocaleTimeString('uk-UA', { hour: '2-digit', minute: '2-digit' });
    return `<div class="day-card">

      <p class="meta">${time} · ${fmtDur(h.endedAt - h.startedAt)} · ${fmtKg(histVolume(h))} кг · ${histSets(h)} ${setWord(histSets(h))}</p>
      <div class="gdots">${gs.length > 1 ? `<b>${gs.length} групи м’язів:</b> ` : ''}${gs.map(g => `<span style="${gColor(g.id)}"><i></i>${esc(groupById[g.id].name)} ${g.sets}</span>`).join(' · ')}</div>
      ${gs.map(g => `<div class="gsec" style="${gColor(g.id)}">
        <h4>${esc(groupById[g.id].name)} <span>${g.sets} ${setWord(g.sets)}</span></h4>

          const e = byId[x.exerciseId];
          return `<li><a href="#/exercise/${e.id}">${esc(e.name)}</a>${groupById[g.id].subs ? ` <span>· ${esc(subName(e))}</span>` : ''}<br>
            <span>${x.sets.length} ${setWord(x.sets.length)}: ${prevLine(x.sets)}</span></li>`;

  }).join('');
  return `<section class="block" id="dayPanel">
    <h2 class="section-title" style="margin-top:0">${dayTitle(ts)}</h2>
    ${cards || `<p class="muted-line">${canLog ? 'Відпочинок — тренувань не записано.' : 'Цей день ще попереду.'}</p>`}

  </section>`;
}

function setDataMsg(id, text, ok) {
  const el = $('#' + id);
  if (!el) return;
  el.textContent = text;
  el.className = 'muted-line ' + (ok ? 'msg-ok' : 'msg-err');
}
function exportPayload() {
  const { active, ...data } = state;
  return JSON.stringify({ app: 'sila', version: 2, exportedAt: new Date().toISOString(), data });
}
function importData(text, mode) {
  const tok = tokenFromText(text);
  if (tok) {
    const r = parseRoutineToken(tok);
    if (!r) return { ok: false, text: 'Посилання на тренування пошкоджене — попроси надіслати його ще раз.' };
    state.routines.push({ ...r, id: uid(), createdAt: Date.now() });
    saveState();
    return { ok: true, text: `Додано тренування «${r.name}» у «Мої тренування».` };
  }
  let obj;
  try { obj = JSON.parse(text); } catch (e) { return { ok: false, text: 'Це не дані застосунку: текст не є коректним JSON.' }; }
  const raw = obj && obj.data && typeof obj.data === 'object' ? obj.data : obj;
  if (!raw || typeof raw !== 'object' || !(Array.isArray(raw.history) || Array.isArray(raw.routines) || Array.isArray(raw.favs))) {
    return { ok: false, text: 'У тексті немає ні історії, ні шаблонів, ні обраного.' };
  }
  const inc = sanitizeState(raw);
  if (mode === 'replace') {
    const active = state.active;
    Object.assign(state, inc, { active });
    saveState();
    return { ok: true, text: `Дані замінено: ${countText(inc.history.length, inc.routines.length)}, ${inc.favs.length} в обраному.` };
  }
  let addH = 0, addR = 0, updR = 0, addF = 0;
  const hIds = new Set(state.history.map(h => h.id));
  inc.history.forEach(h => { if (!hIds.has(h.id)) { state.history.push(h); addH++; } });
  state.history.sort((a, b) => b.startedAt - a.startedAt);
  inc.routines.forEach(r => {
    const cur = routineById(r.id);
    if (!cur) { state.routines.push(r); addR++; }
    else if ((r.updatedAt || r.createdAt || 0) > (cur.updatedAt || cur.createdAt || 0)) { Object.assign(cur, r); updR++; }
  });
  inc.favs.forEach(id => { if (!state.favs.includes(id)) { state.favs.push(id); addF++; } });
  inc.favPrograms.forEach(id => { if (!state.favPrograms.includes(id)) state.favPrograms.push(id); });
  Object.entries(inc.prog).forEach(([k, v]) => { if (!state.prog[k]) state.prog[k] = v; });
  saveState();
  return { ok: true, text: `Готово. Додано: ${countText(addH, addR)}${updR ? `, оновлено шаблонів: ${updR}` : ''}, в обране: ${addF}.` };
}
const countText = (h, r) => `${h} ${plural(h, ['тренування', 'тренування', 'тренувань'])}, ${r} ${plural(r, ['шаблон', 'шаблони', 'шаблонів'])}`;
function copyText(text) {
  const fallback = () => {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    return ok;
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    return navigator.clipboard.writeText(text).then(() => true, () => fallback());
  }
  return Promise.resolve(fallback());
}

document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]');
  if (!t || t.disabled) return;
  switch (t.dataset.act) {
    case 'cal-month': {
      let { y, m } = ui.cal;
      m += +t.dataset.d;
      if (m < 0) { m = 11; y--; } else if (m > 11) { m = 0; y++; }
      const mk = `${y}-${String(m + 1).padStart(2, '0')}`;
      const inMonth = state.history.find(h => dayKey(h.startedAt).startsWith(mk));
      const todayK = dayKey(Date.now());
      ui.cal = { ...ui.cal, y, m, sel: todayK.startsWith(mk) ? todayK : inMonth ? dayKey(inMonth.startedAt) : mk + '-01' };
      render(true);
      break;
    }
    case 'cal-day':
      ui.cal.sel = t.dataset.k;
      render(true);
      { const p = $('#dayPanel'); if (p) p.scrollIntoView({ block: 'nearest', behavior: reduceMotion ? 'auto' : 'smooth' }); }
      break;
    case 'cal-filter':
      ui.cal.filter = ui.cal.filter === t.dataset.g ? null : t.dataset.g;
      render(true);
      break;
    case 'cal-log': {
      const k = t.dataset.k;
      const today = k === dayKey(Date.now());
      ui.modal = 'cal-log';
      openModal(`<h3>${today ? 'Почати тренування' : 'Записати тренування'}</h3>
        <p class="sub">${today ? 'Обери шаблон' : `На ${dayTitle(keyTs(k))}. Внесеш вагу й повторення — тренування з’явиться в календарі на цю дату.`}</p>
        <div class="prog-list">${state.routines.map(r => `<button class="row-link" style="margin-top:0" data-act="cal-log-start" data-k="${k}" data-rid="${r.id}">${ICON.gym}<span class="grow">${esc(r.name)}<small>${blockName(r.block)} · ${r.exercises.length} ${exWord(r.exercises.length)}</small></span>${ICON.chev}</button>`).join('')}</div>
        <button class="btn secondary" style="margin-top:10px" data-act="cal-log-start" data-k="${k}" data-rid="">${ICON.plus} Без шаблону — додам вправи сам</button>
        <button class="link-btn" data-act="modal-close">Скасувати</button>`);
      break;
    }
    case 'cal-log-start': {
      const k = t.dataset.k;
      const logDate = k === dayKey(Date.now()) ? null : keyTs(k, 18);
      const r = t.dataset.rid && routineById(t.dataset.rid);
      closeModal();
      if (r) startWorkout(r.name, r.id, r.block, r.exercises, logDate);
      else startWorkout('Тренування', null, 'full', [], logDate);
      break;
    }

    case 'data-download': {
      try {
        const blob = new Blob([exportPayload()], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `sila-backup-${dayKey(Date.now())}.json`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 2000);
        setDataMsg('dataMsg1', `Файл ${a.download} завантажується — перевір папку «Завантаження».`, true);
      } catch (e) {
        setDataMsg('dataMsg1', 'Браузер не дав зберегти файл — скористайся «Скопіювати текст».', false);
      }
      break;
    }
    case 'data-copy':
      copyText(exportPayload()).then(ok => setDataMsg('dataMsg1', ok
        ? 'Скопійовано. Встав цей текст у розділі «Вставити дані» на іншому пристрої або збережи в нотатках.'
        : 'Не вдалося скопіювати автоматично — скористайся «Завантажити файл».', ok));
      break;
    case 'data-import': {
      const text = $('#dataText').value.trim();
      if (!text) { setDataMsg('dataMsg2', 'Спершу вибери файл або встав текст.', false); break; }
      const mode = (document.querySelector('input[name="impMode"]:checked') || {}).value || 'merge';
      const run = () => { ui.dataMsg = importData(text, mode); render(true); };
      if (mode === 'replace') {
        confirmModal('Замінити всі дані?', 'Поточні шаблони, історія й обране буде замінено даними з копії. Це не можна скасувати.', 'Замінити', run, 'Скасувати', null, true);
      } else run();
      break;
    }
  }
});

/* =====================================================================
   ВСТАНОВЛЕННЯ ТА «ПОДІЛИТИСЯ З РОДИНОЮ»

function toast(text) {
  let el = $('#toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    el.className = 'toast';
    el.setAttribute('role', 'status');
    document.body.appendChild(el);

  el.hidden = false;
  clearTimeout(toast.t);
  toast.t = setTimeout(() => { el.hidden = true; }, 4500);
}
function shareOrCopy(title, text, url) {
  const full = text + '\n' + url;
  const copy = () => copyText(full).then(ok => toast(ok
    ? 'Посилання скопійовано — встав його в Viber, Telegram чи SMS.'
    : 'Не вдалося скопіювати автоматично. Посилання: ' + url));
  if (navigator.share) navigator.share({ title, text, url }).catch(err => { if (!err || err.name !== 'AbortError') copy(); });
  else copy();
}

// Код тренування: base64url від стислого JSON (лише літери, цифри, «-» і «_»)
const b64u = s => btoa(unescape(encodeURIComponent(s))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64u = s => decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/'))));
const routineToken = r => b64u(JSON.stringify({ v: 1, n: r.name, b: r.block, e: r.exercises.map(x => [x.exerciseId, x.sets, x.reps, x.rest, x.note || '']) }));
function parseRoutineToken(tok) {
  try {
    const o = JSON.parse(unb64u(tok));
    if (!o || o.v !== 1 || !Array.isArray(o.e)) return null;
    const exercises = o.e.filter(a => Array.isArray(a) && byId[a[0]]).map(a => ({
      exerciseId: a[0], sets: Math.min(10, Math.max(1, Math.round(+a[1]) || 3)), reps: String(a[2] || '8–12').slice(0, 20),
      rest: Math.min(600, Math.max(0, Math.round(+a[3]) || 0)), note: String(a[4] || '').slice(0, 80)
    }));
    if (!exercises.length) return null;
    return { name: String(o.n || 'Тренування').slice(0, 60), block: BLOCKS.some(b => b[0] === o.b) ? o.b : guessBlock(exercises.map(x => x.exerciseId)), exercises };
  } catch (e) { return null; }
}
const tokenFromText = text => { const m = String(text).match(/shared\/([A-Za-z0-9_-]{8,})/); return m ? m[1] : null; };

/* ---------- Офлайн: зберегти всі фото ---------- */
async function cacheAllImages(btn, msgId) {
  if (!('caches' in window) || !/^https?:$/.test(location.protocol)) {
    setDataMsg(msgId, 'Збереження фото працює в онлайн-версії застосунку.', false);
    return;
  }
  const urls = [...new Set(EXERCISES.flatMap(e => e.images))];
  btn.disabled = true;
  try {
    const cache = await caches.open('sila-img-v1');
    let done = 0;
    for (let i = 0; i < urls.length; i += 8) {
      await Promise.all(urls.slice(i, i + 8).map(async u => {
        if (!(await cache.match(u))) { const res = await fetch(u); if (res.ok) await cache.put(u, res); }
        done++;
      }));
      setDataMsg(msgId, `Збережено ${done} з ${urls.length} фото…`, true);
    }
    setDataMsg(msgId, `Готово: усі ${urls.length} фото доступні без інтернету.`, true);
  } catch (e) {
    setDataMsg(msgId, 'Не вдалося зберегти всі фото — перевір інтернет і спробуй ще раз.', false);
  } finally {
    btn.disabled = false;
  }
}

/* ---------- Трекер підходів ---------- */
let tracker = { key: null };
function trackerFor(cfg) {
  return tracker.key === cfg.key ? tracker : { ...cfg, done: 0, phase: 'idle' };
}
function claimTracker(cfg) {
  if (tracker.key !== cfg.key) { cancelTimer(); tracker = { ...cfg, done: 0, phase: 'idle' }; }
  return tracker;
}
function trackerHtml(cfg) {
  const t = trackerFor(cfg);
  const next = t.done + 1;
  const timed = t.hold > 0;
  const target = timed ? 'утримання ' + fmtRest(t.hold) : t.target + (t.inRun ? ' повт.' : '');
  const status = {
    idle:     `<b>${t.total} ${setWord(t.total)} × ${esc(target)}</b>Відпочинок між підходами — ${fmtRest(t.rest)}.`,
    working:  `<b>Підхід ${next} з ${t.total}</b>Виконуй ${esc(target)} з правильною технікою.`,
    holding:  `<b>Утримання · підхід ${next} з ${t.total}</b>Тримай положення, доки йде таймер.`,
    rest:     `<b>Відпочинок</b>Далі підхід ${next} з ${t.total}.`,
    ready:    `<b>Підхід ${next} з ${t.total}</b>Відпочинок завершено — до роботи!`,
    finished: `<b>Вправу виконано!</b>Усі ${t.total} ${setWord(t.total)} зроблено.`
  }[t.phase];
  const startLabel = timed ? 'Почати утримання' : 'Почати підхід';
  const finishedBtn = t.inRun
    ? `<button class="btn" data-act="run-next">${run && run.idx === run.items.length - 1 ? ICON.trophy + ' Завершити тренування' : 'Наступна вправа ' + ICON.chev}</button>`
    : `<button class="btn secondary" data-act="tracker-reset">Почати знову</button>`;
  const button = {
    idle:     `<button class="btn" data-act="set-start">${ICON.play} ${startLabel} 1</button>`,
    working:  `<button class="btn" data-act="set-done">${ICON.check} Підхід виконано</button>`,
    holding:  `<button class="btn secondary" data-act="skip-rest">Завершити утримання</button>`,
    rest:     `<button class="btn secondary" data-act="skip-rest">Пропустити відпочинок</button>`,
    ready:    `<button class="btn" data-act="set-start">${ICON.play} ${startLabel} ${next}</button>`,
    finished: finishedBtn
  }[t.phase];
  const minSets = Math.max(1, t.done + (t.phase === 'working' || t.phase === 'holding' ? 1 : 0));
  return `<div class="tracker-head">
      <h3 class="block-title">${ICON.timer} ${t.inRun ? 'Підходи' : 'Тренування'}</h3>
      <div class="stepper" role="group" aria-label="Кількість підходів">
        <button class="icon-btn" data-act="sets" data-d="-1" aria-label="Менше підходів" ${t.total <= minSets ? 'disabled' : ''}>${ICON.minus}</button>
        <b>${t.total} ${setWord(t.total)}</b>
        <button class="icon-btn" data-act="sets" data-d="1" aria-label="Більше підходів" ${t.total >= 10 ? 'disabled' : ''}>${ICON.plus}</button>
      </div>
    </div>
    <div class="dots" aria-hidden="true">${Array.from({ length: t.total }, (_, i) =>
      `<span class="dot ${i < t.done ? 'done' : ''} ${i === t.done && (t.phase === 'working' || t.phase === 'holding') ? 'cur' : ''}"></span>`).join('')}</div>
    <p class="tracker-status">${status}</p>${button}`;
}
function refreshTracker() {
  const box = $('#tracker');
  if (box && ui.cfg) box.innerHTML = trackerHtml(ui.cfg);
}
function completeSet() {
  tracker.done++;
  if (tracker.done >= tracker.total) {
    tracker.phase = 'finished';
    cancelTimer();
  } else if (tracker.rest > 0) {
    tracker.phase = 'rest';
    startTimer('rest', tracker.rest);
  } else {
    tracker.phase = 'ready';
    cancelTimer();
  }
  refreshTracker();
}

/* ---------- Звук (Web Audio API, без файлів) ---------- */
let actx = null;
function ensureAudio() {
  try {
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
  } catch (e) { actx = null; }
}
function tone(at, dur, freq) {
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = 'sine';
  o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, at);
  g.gain.exponentialRampToValueAtTime(0.4, at + 0.02);
  g.gain.setValueAtTime(0.4, at + dur - 0.06);
  g.gain.exponentialRampToValueAtTime(0.0001, at + dur);
  o.connect(g).connect(actx.destination);
  o.start(at);
  o.stop(at + dur + 0.02);
  return o;
}

/* ---------- Таймер (відпочинок / утримання) ---------- */
// Час рахується від Date.now(), а сигнали заплановані в AudioContext,
// тому таймер не збивається, навіть коли вкладка у фоні.
const timer = { active: false, mode: 'rest', owner: 'tracker', info: null, endAt: 0, total: 0, int: null, nodes: [] };
const RING_C = 2 * Math.PI * 42;

function scheduleBeeps() {
  cancelBeeps();
  if (!state.sound || !actx) return;
  const left = (timer.endAt - Date.now()) / 1000;
  const now = actx.currentTime;
  if (left > 3.1) timer.nodes.push(tone(now + left - 3, 0.15, 880));
  if (left > 0) {
    timer.nodes.push(tone(now + left, 0.25, 990));
    timer.nodes.push(tone(now + left + 0.3, 0.7, 990));
  }
}
function cancelBeeps() {
  timer.nodes.forEach(o => { try { o.stop(); } catch (e) { /* вже зупинено */ } });
  timer.nodes = [];
}
// owner: 'tracker' — трекер підходів на картці вправи / у комплексі; 'log' — журнал «Моїх тренувань»
function startTimer(mode, sec, owner = 'tracker', info = null) {
  ensureAudio();
  timer.active = true;
  timer.mode = mode;
  timer.owner = owner;
  timer.info = info;
  timer.total = sec * 1000;
  timer.endAt = Date.now() + timer.total;
  scheduleBeeps();
  clearInterval(timer.int);
  timer.int = setInterval(tick, 250);
  showTimer(false);
  tick();
}
function tick() {
  if (!timer.active) return;
  const left = timer.endAt - Date.now();
  if (left <= 0) return finishTimer(false);
  drawTimer(left);
}
function finishTimer(playNow) {
  clearInterval(timer.int);
  timer.active = false;
  if (playNow && state.sound && actx) { cancelBeeps(); timer.nodes.push(tone(actx.currentTime, 0.7, 990)); }
  timer.nodes = [];
  if (state.vibrate && navigator.vibrate) { try { navigator.vibrate([250, 120, 250]); } catch (e) { /* немає підтримки */ } }
  if (timer.owner === 'log') {
    drawTimer(0);
    showTimer(true);
    return;
  }
  if (timer.mode === 'hold') {
    hideTimer();
    completeSet();
    return;
  }
  tracker.phase = 'ready';
  drawTimer(0);
  showTimer(true);
  refreshTracker();
}
function cancelTimer() {
  clearInterval(timer.int);
  timer.active = false;
  cancelBeeps();
  hideTimer();
}
function adjustTimer(delta) {
  if (!timer.active) return;
  timer.endAt += delta * 1000;
  const left = timer.endAt - Date.now();
  if (left <= 0) return finishTimer(true);
  timer.total = Math.max(timer.total + delta * 1000, left);
  scheduleBeeps();
  tick();
}
function drawTimer(left) {
  $('#tTime').textContent = fmtClock(Math.ceil(left / 1000));
  $('#ringFg').style.strokeDashoffset = timer.total ? RING_C * (1 - left / timer.total) : 0;
}
function showTimer(done) {
  const el = $('#timer');
  el.classList.toggle('log', timer.owner === 'log');
  if (timer.owner === 'log') {
    el.classList.add('show');
    el.classList.toggle('done', done);
    el.classList.remove('hold');
    $('#tLabel').textContent = done ? 'Час!' : 'Відпочинок';
    $('#tNext').textContent = timer.info ? timer.info.next : '';
    $('#tName').textContent = timer.info ? timer.info.name : '';
    $('#tSkip').textContent = 'Пропустити';
    if (done) $('#ringFg').style.strokeDashoffset = 0;
    drawSoundBtn();
    document.body.classList.add('has-timer');
    return;
  }
  const e = byId[tracker.exId];
  const next = tracker.done + 1;
  const hold = timer.mode === 'hold' && !done;
  el.classList.add('show');
  el.classList.toggle('done', done);
  el.classList.toggle('hold', hold);
  $('#tLabel').textContent = done ? 'Час!' : hold ? 'Утримання' : 'Відпочинок';
  $('#tNext').textContent = hold ? `Підхід ${next} з ${tracker.total}` : done ? `Підхід ${next} з ${tracker.total}` : `Далі підхід ${next} з ${tracker.total}`;
  $('#tName').textContent = e ? e.name : '';
  $('#tSkip').textContent = hold ? 'Завершити' : 'Пропустити';
  $('#tStart').textContent = (tracker.hold ? 'Почати утримання ' : 'Почати підхід ') + next;
  if (done) $('#ringFg').style.strokeDashoffset = 0;
  drawSoundBtn();
  document.body.classList.add('has-timer');
}
function hideTimer() {
  $('#timer').classList.remove('show', 'done', 'hold');
  document.body.classList.remove('has-timer');
}
function drawSoundBtn() {
  const b = $('#tSound');
  b.innerHTML = state.sound ? ICON.sound : ICON.mute;
  b.setAttribute('aria-label', state.sound ? 'Вимкнути звук' : 'Увімкнути звук');
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) tick(); });

  $('#modalBody').innerHTML = html;
  $('#modal').hidden = false;
}
function closeModal() { $('#modal').hidden = true; ui.modal = null; }
function settingsHtml() {
  const sw = (act, on) => `<button class="switch" role="switch" aria-checked="${on}" data-act="${act}"></button>`;
  const row = (key, title, rec) => `<div class="set-row"><span>${title}<small>Рекомендовано ${rec}</small></span>
    <div class="stepper">
      <button class="icon-btn" data-act="rest-cfg" data-k="${key}" data-d="-15" aria-label="Менше" ${state.rest[key] <= 15 ? 'disabled' : ''}>${ICON.minus}</button>
      <b>${fmtClock(state.rest[key])}</b>
      <button class="icon-btn" data-act="rest-cfg" data-k="${key}" data-d="15" aria-label="Більше" ${state.rest[key] >= 300 ? 'disabled' : ''}>${ICON.plus}</button>
    </div></div>`;
  return `<h3>Налаштування</h3>
    <div class="set-row"><span>Звуковий сигнал<small>За 3 с до кінця і в кінці таймера</small></span>${sw('sound', state.sound)}</div>
    <div class="set-row"><span>Вібрація<small>Якщо телефон її підтримує</small></span>${sw('vibrate', state.vibrate)}</div>
    <p class="block-title" style="margin-top:20px">Таймер відпочинку для окремих вправ</p>
    ${row('strength', 'Сила', GOALS.strength.rest)}
    ${row('hypComp', 'Гіпертрофія — базові', GOALS.hypertrophy.compound.rest)}
    ${row('hypIso', 'Гіпертрофія — ізолюючі', GOALS.hypertrophy.isolation.rest)}
    ${row('endurance', 'Витривалість', GOALS.endurance.rest)}
    <button class="link-btn" data-act="rest-reset">Повернути стандартні значення</button>
    <button class="row-link" data-act="app-share">${ICON.share}<span class="grow">Поділитися з родиною<small>Посилання на застосунок</small></span>${ICON.chev}</button>
    <a class="row-link" href="#/data" data-act="modal-close">${ICON.down}<span class="grow">Дані: зберегти / вставити<small>Резервна копія, перенесення на телефон</small></span>${ICON.chev}</a>
    <p class="about">У комплексах відпочинок задано для кожної вправи окремо. Фото: free-exercise-db (Unlicense) і wger.de (CC BY-SA 4.0). Схеми тренажерів намальовано для цього застосунку.</p>
    <button class="btn" data-act="modal-close">Готово</button>`;
}
function swapHtml(pid, i) {
  const p = progById[pid];
  const it = progItems(p)[i];
  const cur = byId[it.exerciseId];
  const orig = byId[it.originalId];
  const cands = EXERCISES.filter(e => e.place.includes('gym') && e.muscleGroup === orig.muscleGroup && e.subgroup === orig.subgroup)
    .sort((a, b) => isMachine(b) - isMachine(a));
  return `<h3>Замінити вправу</h3>
    <p class="sub">${esc(subName(orig))} · лише вправи тієї ж підгрупи (${cands.length})</p>
    <div class="ex-list">${cands.map(e => `<article class="ex-card ${e.id === cur.id ? 'current' : ''}">
      <button class="ex-main" style="border:0;background:none;text-align:left;cursor:pointer;width:100%" data-act="swap-pick" data-pid="${pid}" data-i="${i}" data-id="${e.id}">
        <div class="thumb">${thumbImg(e)}</div>
        <div class="ex-text"><b>${esc(e.name)}</b><span class="ex-meta">${EQUIP[e.equipment].name} · ${TYPES[e.type]}${e.id === orig.id ? ' · оригінал' : ''}${e.id === cur.id ? ' · зараз' : ''}</span></div>
      </button></article>`).join('')}</div>
    <button class="btn secondary" style="margin-top:16px" data-act="modal-close">Скасувати</button>`;
}

/* ---------- Обробка дій ---------- */
document.addEventListener('click', ev => {
  const t = ev.target.closest('[data-act]');
  if (!t || t.disabled) return;
  const act = t.dataset.act;
  const id = t.dataset.id;
  switch (act) {
    case 'back': goBack(); break;

    case 'goal':
      state.goal = t.dataset.goal;
      saveState();
      if (tracker.phase === 'idle' || tracker.phase === 'finished') tracker = { key: null };
      render(true);
      break;

    case 'fav':
    case 'fav-prog': {
      const list = act === 'fav' ? state.favs : state.favPrograms;
      const i = list.indexOf(id);
      if (i >= 0) list.splice(i, 1); else list.push(id);
      saveState();
      if (route.name === 'favorites') { render(true); break; }
      const on = list.includes(id);
      document.querySelectorAll(`[data-act="${act}"][data-id="${id}"]`).forEach(b => {
        b.classList.toggle('on', on);
        b.setAttribute('aria-pressed', on);
        b.setAttribute('aria-label', on ? 'Прибрати з обраного' : 'Додати в обране');
      });
      updateNav();
      break;
    }

    case 'feq': ui.eq = t.dataset.v; render(true); break;
    case 'flvl': ui.lvl = t.dataset.v; render(true); break;
    case 'ftype': ui.type = t.dataset.v; render(true); break;
    case 'fmach': ui.machinesOnly = !ui.machinesOnly; render(true); break;

    case 'anim':
      anim.paused = !anim.paused;
      t.innerHTML = anim.paused ? ICON.play : ICON.pause;
      t.setAttribute('aria-label', anim.paused ? 'Відтворити анімацію' : 'Пауза анімації');
      $('#mediaHint').textContent = anim.paused ? 'Торкнись зображення, щоб перемкнути кадр' : 'Кадри чергуються: старт → фініш руху';
      if (anim.paused) stopAnim(); else anim.timer = setInterval(() => setFrame(1 - anim.frame), 800);
      break;
    case 'frame':
      if (anim.paused) setFrame(1 - anim.frame);
      break;

    case 'sets': {
      if (!ui.cfg) break;
      const tr = claimTracker(ui.cfg);
      const minSets = Math.max(1, tr.done + (tr.phase === 'working' || tr.phase === 'holding' ? 1 : 0));
      tr.total = Math.min(10, Math.max(minSets, tr.total + +t.dataset.d));
      if (tr.phase === 'finished' && tr.done < tr.total) tr.phase = 'ready';
      refreshTracker();
      break;
    }
    case 'set-start': {
      ensureAudio(); // розблоковуємо звук жестом користувача
      const fromSheet = !!t.closest('#timer');
      const tr = fromSheet || !ui.cfg ? tracker : claimTracker(ui.cfg);
      if (!tr.key) break;
      cancelTimer();
      if (tr.hold > 0) { tr.phase = 'holding'; startTimer('hold', tr.hold); }
      else tr.phase = 'working';
      refreshTracker();
      break;
    }
    case 'set-done': completeSet(); break;
    case 'skip-rest':
      if (timer.owner === 'log') { cancelTimer(); break; }
      if (timer.active && timer.mode === 'hold') { finishTimer(false); break; }
      cancelTimer();
      tracker.phase = 'ready';
      refreshTracker();
      break;
    case 'tracker-reset':
      cancelTimer();
      tracker = { key: null };
      refreshTracker();
      break;
    case 'rest-plus': adjustTimer(15); break;
    case 'rest-minus': adjustTimer(-15); break;
    case 'timer-close': hideTimer(); break;

    case 'run-start':
      run = null; // нове проходження з першої вправи
      break;
    case 'run-next':
    case 'run-prev':
      if (!run) break;
      cancelTimer();
      tracker = { key: null };
      if (act === 'run-prev') run.idx = Math.max(0, run.idx - 1);
      else if (run.idx >= run.items.length - 1) run.done = true;
      else run.idx++;
      render();
      break;
    case 'run-add-vacuum':
      run.items.push(...progItems(progById['cp-vacuum']).map(it => ({ ...it, fromAddon: true })));
      run.idx = run.items.length - 1;
      run.done = false;
      render();
      break;
    case 'run-exit':
      run = null;
      location.hash = '#/programs';
      break;

    case 'start-week': {
      const week = progById['cp-week'];
      const idx = todayIdx();
      const day = week.days[idx];
      if (day.workouts.length) { ui.weekMsg = ''; location.hash = '#/program/' + day.workouts[0]; break; }
      let k = 1;
      while (k < 7 && !week.days[(idx + k) % 7].workouts.length) k++;
      const nd = week.days[(idx + k) % 7];
      ui.weekMsg = `Сьогодні (${day.label}) — відпочинок. Наступне тренування: <b>${nd.label} — ${esc(nd.title)}</b>. <a href="#/program/${nd.workouts[0]}">Відкрити</a>`;
      render(true);
      break;
    }

    case 'swap-open': ui.modal = 'swap'; openModal(swapHtml(t.dataset.pid, +t.dataset.i)); break;
    case 'swap-pick': {
      const p = progById[t.dataset.pid];
      const i = +t.dataset.i;
      const ed = progEdit(p.id);
      ed.items[i] = ed.items[i] || {};
      if (id === p.exercises[i].exerciseId) delete ed.items[i].exerciseId; else ed.items[i].exerciseId = id;
      saveState();
      if (run && run.pid === p.id) run = null;
      closeModal();
      render(true);
      break;
    }

    case 'settings': ui.modal = 'settings'; openModal(settingsHtml()); break;
    case 'modal-close': closeModal(); break;
    case 'sound':
      state.sound = !state.sound;
      saveState();
      if (state.sound) ensureAudio();
      if (timer.active) scheduleBeeps(); else cancelBeeps();
      drawSoundBtn();
      if (ui.modal === 'settings') openModal(settingsHtml());
      break;
    case 'vibrate':
      state.vibrate = !state.vibrate;
      saveState();
      openModal(settingsHtml());
      break;
    case 'rest-cfg': {
      const k = t.dataset.k;
      state.rest[k] = Math.min(300, Math.max(15, state.rest[k] + +t.dataset.d));
      saveState();
      openModal(settingsHtml());
      if (tracker.phase === 'idle') tracker = { key: null };
      break;
    }
    case 'rest-reset':
      state.rest = { ...DEFAULT_REST };
      saveState();
      openModal(settingsHtml());
      break;
  }
});
// Чекбокси комплексів (зміна стану, а не клік)
document.addEventListener('change', ev => {
  const t = ev.target;
  if (!t.dataset || !t.dataset.act) return;
  if (t.dataset.act === 'item-verified') {
    const ed = progEdit(t.dataset.pid);
    const i = +t.dataset.i;
    ed.items[i] = ed.items[i] || {};
    ed.items[i].verified = t.checked;
    saveState();
    render(true);
  } else if (t.dataset.act === 'prog-verified') {
    progEdit(route.id).verified = t.checked;
    saveState();
  } else if (t.dataset.act === 'toggle-vacuum') {
    state.addVacuum = t.checked;
    saveState();
    run = null;
  }
});
document.addEventListener('keydown', ev => {
  if (ev.key === 'Escape' && !$('#modal').hidden) closeModal();
});

window.addEventListener('hashchange', () => { trackNav(); render(); });
$('#ringFg').style.strokeDasharray = RING_C;
trackNav();
render();
</script>
</body>
</html>

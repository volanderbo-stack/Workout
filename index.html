<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0e11">
<meta name="description" content="Силові тренування вдома й у залі: вправи на тренажерах, комплекси, журнал підходів і календар.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Сила">
<title>Сила — тренування на тренажерах</title>
<style>
:root {
  --bg: #0c0e11;
  --surface: #15191e;
  --surface-2: #1d2229;
  --border: #272d35;
  --text: #f1f3f5;
  --muted: #959ea9;
  --accent: #c6f35e;
  --accent-ink: #0c0e11;
  --accent-soft: rgba(198, 243, 94, .12);
  --accent-line: rgba(198, 243, 94, .35);
  --danger: #ff6b6b;
  --danger-soft: rgba(255, 107, 107, .1);
  --gold: #ffc861;
  --gold-soft: rgba(255, 200, 97, .12);
  --lvl-b: #7ee0a1;
  --lvl-i: #ffc861;
  --lvl-a: #ff8a7a;
  --photo-bg: #ffffff;
  /* кольори груп м'язів (календар, історія) */
  --g-chest: #ff7b72;
  --g-back: #58a6ff;
  --g-shoulders: #e3b341;
  --g-traps: #d2a8ff;
  --g-biceps: #56d364;
  --g-triceps: #39c5cf;
  --g-forearms: #b1a79c;
  --g-legs: #f778ba;
  --g-abs: #ffa657;
  --radius: 18px;
  --nav-h: 64px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ico { width: 22px; height: 22px; flex: none; }
[hidden] { display: none !important; }

.app {
  max-width: 560px;
  margin: 0 auto;
  min-height: 100vh;
  padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 24px);
}
body.has-timer .app { padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 210px); }

/* ---------- Верхня панель ---------- */
.topbar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 4px;
  min-height: 60px; padding: 8px 8px 8px 16px;
  padding-top: calc(8px + env(safe-area-inset-top));
  background: rgba(12, 14, 17, .88);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
.topbar.has-back { padding-left: 4px; }
.topbar h1 {
  flex: 1; min-width: 0; margin: 0;
  font-size: 18px; font-weight: 700;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.topbar h1.brand { font-size: 22px; letter-spacing: -.02em; }
.topbar h1.brand span { color: var(--accent); }
.icon-btn {
  width: 44px; height: 44px; flex: none;
  display: grid; place-items: center;
  border: 0; border-radius: 12px; background: transparent; cursor: pointer;
}
.icon-btn:active { background: var(--surface-2); }
.icon-btn:disabled { opacity: .3; cursor: default; }

.screen { padding: 4px 16px 24px; }

/* ---------- Головна ---------- */
.hero h2 { font-size: 28px; line-height: 1.15; margin: 4px 0 16px; letter-spacing: -.02em; }
.eyebrow {
  margin: 6px 0 0; color: var(--accent);
  font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
}
.place-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.place-card {
  display: flex; flex-direction: column; gap: 4px;
  min-height: 190px; padding: 16px;
  border-radius: var(--radius); border: 1.5px solid var(--border);
  background: var(--surface); text-decoration: none;
  transition: border-color .2s, transform .15s;
}
.place-card:active, .group-card:active, .prog-card:active { transform: scale(.98); }
.place-card.is-active { border-color: var(--accent); background: linear-gradient(160deg, var(--accent-soft), var(--surface) 65%); }
.place-ico {
  width: 52px; height: 52px; margin-bottom: 10px;
  display: grid; place-items: center;
  border-radius: 16px; background: var(--surface-2); color: var(--accent);
}
.place-ico .ico { width: 28px; height: 28px; }
.place-name { font-size: 20px; font-weight: 700; }
.place-desc { flex: 1; color: var(--muted); font-size: 13px; }
.place-count { color: var(--accent); font-size: 13px; font-weight: 600; }

.row-link {
  display: flex; align-items: center; gap: 12px;
  min-height: 56px; margin-top: 12px; padding: 10px 16px;
  border-radius: 16px; border: 1px solid var(--border);
  background: var(--surface); text-decoration: none; font-weight: 600;
}
.row-link > .ico:first-child { color: var(--accent); }
.row-link .grow { flex: 1; min-width: 0; }
.row-link .grow small { display: block; color: var(--muted); font-weight: 500; font-size: 13px; }
.row-link .badge { color: var(--muted); font-weight: 500; }
.row-link.today { border-color: var(--accent-line); background: linear-gradient(160deg, var(--accent-soft), var(--surface) 70%); }

/* ---------- Блоки ---------- */
.block { margin-top: 24px; }
.block-title {
  display: flex; align-items: center; gap: 8px;
  margin: 0 0 10px; color: var(--muted);
  font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
}
.block-title .ico { width: 18px; height: 18px; }
.section-title { margin: 28px 0 4px; font-size: 20px; letter-spacing: -.01em; }
.section-sub { margin: 0 0 12px; color: var(--muted); font-size: 14px; }

.seg {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px;
  padding: 4px; border-radius: 14px;
  border: 1px solid var(--border); background: var(--surface);
}
.seg-btn {
  min-height: 44px; padding: 0 4px;
  display: grid; place-items: center;
  border: 0; border-radius: 10px; background: transparent; cursor: pointer;
  color: var(--muted); font-size: 14px; font-weight: 600; text-decoration: none; text-align: center;
  transition: background .2s, color .2s;
}
.seg-btn.on { background: var(--accent); color: var(--accent-ink); }
.seg.small .seg-btn { min-height: 40px; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 10px; }
.stat {
  padding: 12px 6px; text-align: center;
  border-radius: 14px; border: 1px solid var(--border); background: var(--surface);
}
.stat b { display: block; font-size: 20px; letter-spacing: -.01em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.stat span { color: var(--muted); font-size: 12px; }
.stat-split { margin-top: 8px; display: grid; gap: 6px; }
.stat-line {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 12px; border-radius: 12px; background: var(--surface); border: 1px solid var(--border); font-size: 14px;
}
.stat-line { flex-wrap: wrap; }
.stat-line span { color: var(--muted); }
.stat-line b { white-space: nowrap; }
.stat-line.on { border-color: var(--accent-line); }
.stat-line.on span { color: var(--accent); }
.hint {
  display: flex; gap: 10px; margin: 10px 0 0; padding: 12px;
  border-radius: 14px; background: var(--accent-soft); color: var(--text); font-size: 14px;
}
.hint .ico { color: var(--accent); width: 20px; height: 20px; margin-top: 1px; }
.goal-note { margin: 8px 2px 0; color: var(--muted); font-size: 13px; }

/* ---------- Групи м'язів ---------- */
.group-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 16px; }
.group-card {
  display: flex; flex-direction: column; overflow: hidden;
  border-radius: var(--radius); border: 1px solid var(--border);
  background: var(--surface); text-decoration: none;
  transition: transform .15s;
}
.group-card.big { grid-column: 1 / -1; border-color: var(--accent-line); }
.group-img { position: relative; aspect-ratio: 3 / 2; background: var(--photo-bg); display: grid; place-items: center; overflow: hidden; }
.group-card.big .group-img { aspect-ratio: 2 / 1; }
.group-img img { width: 100%; height: 100%; object-fit: cover; }
.group-img svg { width: 100%; height: 100%; background: var(--surface-2); }
.group-info { display: flex; flex-direction: column; padding: 10px 12px 12px; }
.group-info b { font-size: 17px; }
.group-info span { color: var(--accent); font-size: 13px; font-weight: 600; }
.sub-links { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 12px 12px; }
.sub-links a {
  min-height: 36px; padding: 0 12px; display: inline-flex; align-items: center; gap: 6px;
  border-radius: 999px; background: var(--surface-2); text-decoration: none; font-size: 13px; font-weight: 600;
}
.sub-links a small { color: var(--muted); font-weight: 500; }

/* ---------- Пошук і фільтри ---------- */
.search {
  display: flex; align-items: center; gap: 10px;
  min-height: 50px; margin-top: 12px; padding: 0 14px;
  border-radius: 14px; border: 1px solid var(--border); background: var(--surface);
  text-decoration: none;
}
.search:focus-within { border-color: var(--accent-line); }
.search .ico { color: var(--muted); }
.search input {
  flex: 1; min-width: 0; height: 48px;
  border: 0; outline: 0; background: transparent; color: var(--text);
}
.search input::placeholder, .search .ph-text { color: var(--muted); }
.select {
  display: flex; align-items: center; gap: 10px;
  min-height: 48px; margin-top: 10px; padding: 0 14px;
  border-radius: 14px; border: 1px solid var(--border); background: var(--surface);
}
.select span { color: var(--muted); font-size: 14px; }
.select select {
  flex: 1; min-width: 0; height: 46px;
  border: 0; outline: 0; background: transparent; color: var(--text); font: inherit; font-weight: 600;
}
.select option { background: var(--surface-2); }
.chips {
  display: flex; gap: 8px; overflow-x: auto;
  margin: 10px -16px 0; padding: 2px 16px;
  scrollbar-width: none;
}
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; min-height: 44px; padding: 0 14px;
  display: inline-flex; align-items: center; gap: 6px;
  border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
  font-size: 14px; cursor: pointer; white-space: nowrap; text-decoration: none;
}
.chip .ico { width: 18px; height: 18px; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.chip.toggle.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent-line); }
.count { margin: 16px 2px 8px; color: var(--muted); font-size: 13px; }

/* ---------- Список вправ ---------- */
.ex-list { display: grid; gap: 10px; }
.ex-card {
  display: flex; align-items: center;
  border-radius: 16px; border: 1px solid var(--border); background: var(--surface);
}
.ex-main {
  flex: 1; min-width: 0;
  display: flex; align-items: center; gap: 12px;
  padding: 10px; text-decoration: none;
}
.thumb {
  position: relative; width: 80px; height: 80px; flex: none; overflow: hidden;
  display: grid; place-items: center;
  border-radius: 12px; background: var(--photo-bg);
}
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.thumb svg { width: 100%; height: 100%; background: var(--surface-2); }
.thumb .st, .thumb .sl, .thumb .sd, .group-img .st, .group-img .sl, .group-img .sd { display: none; }
.thumb-ph { width: 100%; height: 100%; display: grid; place-items: center; background: var(--surface-2); color: var(--muted); }
.thumb-ph .ico { width: 32px; height: 32px; }
.thumb-tag {
  position: absolute; left: 4px; bottom: 4px; padding: 1px 6px; border-radius: 6px;
  background: rgba(12, 14, 17, .8); color: var(--accent); font-size: 10px; font-weight: 700; letter-spacing: .04em;
}
.ex-text { min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ex-text b { font-size: 16px; line-height: 1.25; }
.ex-meta { display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; color: var(--muted); font-size: 13px; }
.ex-muscles { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lvl { display: inline-flex; align-items: center; gap: 5px; }
.lvl::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.lvl-beginner { color: var(--lvl-b); }
.lvl-intermediate { color: var(--lvl-i); }
.lvl-advanced { color: var(--lvl-a); }
.star { color: var(--muted); margin-right: 4px; }
.star.on { color: var(--accent); }
.star.on .ico { fill: currentColor; }

.empty { padding: 40px 16px; text-align: center; color: var(--muted); }
.empty .ico { width: 44px; height: 44px; color: var(--border); margin-bottom: 8px; }
.empty b { display: block; color: var(--text); font-size: 18px; margin-bottom: 4px; }
.btn {
  min-height: 52px; width: 100%; padding: 0 18px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border: 0; border-radius: 14px; background: var(--accent); color: var(--accent-ink);
  font-size: 16px; font-weight: 700; text-decoration: none; cursor: pointer;
  transition: transform .1s, opacity .2s;
}
.btn:active { transform: scale(.98); }
.btn.secondary { background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
.btn.small { min-height: 40px; width: auto; padding: 0 14px; font-size: 14px; border-radius: 12px; }
.btn:disabled { opacity: .4; cursor: default; }
.empty .btn { width: auto; margin-top: 16px; }

/* ---------- Картка вправи ---------- */
.media {
  position: relative; margin: 4px 0 0; overflow: hidden;
  aspect-ratio: 3 / 2; border-radius: var(--radius); background: var(--surface-2);
  cursor: pointer; user-select: none;
}
.media .f {
  position: absolute; inset: 0; width: 100%; height: 100%;
  object-fit: contain; opacity: 0; transition: opacity .3s; background: var(--photo-bg);
}
.media .f.on { opacity: 1; }
.media .ph { display: none; }
.media.failed { cursor: default; }
.media.failed .f, .media.failed .frame-tag, .media.failed .media-btn { display: none; }
.media.failed .ph {
  position: absolute; inset: 0; padding: 20px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; text-align: center;
}
.ph-ico { width: 84px; height: 84px; display: grid; place-items: center; border-radius: 24px; background: var(--surface); color: var(--accent); }
.ph-ico .ico { width: 46px; height: 46px; stroke-width: 1.6; }
.ph b { font-size: 18px; }
.ph small { color: var(--muted); font-size: 13px; }
.media.single, .media.scheme { cursor: default; }
.media.single .media-btn, .media.scheme .media-btn { display: none; }
.media.scheme svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.frame-tag {
  position: absolute; top: 10px; left: 10px;
  padding: 4px 10px; border-radius: 999px;
  background: rgba(12, 14, 17, .78); color: #fff; font-size: 12px; font-weight: 600;
}
.media.scheme .frame-tag { color: var(--accent); letter-spacing: .08em; text-transform: uppercase; }
.media-btn {
  position: absolute; right: 10px; bottom: 10px;
  width: 44px; height: 44px; display: grid; place-items: center;
  border: 0; border-radius: 50%; background: rgba(12, 14, 17, .78); color: #fff; cursor: pointer;
}
.media-hint { margin: 8px 2px 0; color: var(--muted); font-size: 12px; text-align: center; }

/* SVG-схеми тренажерів */
.sg { stroke: var(--border); stroke-width: 2; }
.sf { fill: none; stroke: var(--muted); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.sp { fill: var(--surface); stroke: var(--muted); stroke-width: 2; }
.ss { fill: var(--border); stroke: var(--muted); stroke-width: 1.5; }
.sb { fill: none; stroke: var(--text); stroke-width: 5; stroke-linecap: round; stroke-linejoin: round; }
.sm { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; }
.smp { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; }
.smf { fill: var(--accent); }
.sc { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 4 4; }
.sa { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.sl { stroke: var(--muted); stroke-width: 1; }
.sd { fill: var(--accent); }
.st { fill: var(--text); font-size: 11px; font-weight: 600; font-family: inherit; }

.ex-head { margin-top: 16px; }
.ex-head h2 { margin: 0; font-size: 26px; line-height: 1.2; letter-spacing: -.02em; }
.aka { margin: 4px 0 10px; color: var(--muted); font-size: 14px; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag {
  display: inline-flex; align-items: center; gap: 6px;
  min-height: 30px; padding: 0 10px;
  border-radius: 999px; background: var(--surface-2); font-size: 13px;
}
.tag .ico { width: 16px; height: 16px; color: var(--muted); }
.tag.gold { background: var(--gold-soft); color: var(--gold); }
.tag.accent { background: var(--accent-soft); color: var(--accent); }

.mchips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.mchip { padding: 6px 12px; border-radius: 999px; font-size: 14px; background: var(--surface-2); color: var(--text); }
.mchip.primary { background: var(--accent-soft); color: var(--accent); font-weight: 600; box-shadow: inset 0 0 0 1px var(--accent-line); }
.m-label { margin: 0 0 6px; color: var(--muted); font-size: 13px; }

.setup { padding: 14px; border-radius: 16px; border: 1px solid var(--accent-line); background: linear-gradient(160deg, var(--accent-soft), transparent 70%); }
.setup .block-title { color: var(--accent); }
.checklist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.checklist li { display: grid; grid-template-columns: 22px 1fr; gap: 10px; font-size: 15px; }
.checklist li .ico { width: 20px; height: 20px; color: var(--accent); margin-top: 1px; }
.variations li .ico { color: var(--gold); }

.steps { list-style: none; margin: 0; padding: 0; counter-reset: s; display: grid; gap: 8px; }
.steps li {
  counter-increment: s;
  display: grid; grid-template-columns: 32px 1fr; gap: 12px; align-items: start;
  padding: 12px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface);
}
.steps li::before {
  content: counter(s);
  width: 32px; height: 32px; display: grid; place-items: center;
  border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 700;
}
.mistakes ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.mistakes li {
  display: grid; grid-template-columns: 20px 1fr; gap: 10px;
  padding: 11px 12px; border-radius: 12px;
  border-left: 3px solid var(--danger); background: var(--danger-soft);
}
.mistakes li .ico { width: 18px; height: 18px; color: var(--danger); margin-top: 2px; }
.mistakes .block-title { color: var(--danger); }
.tip { display: flex; gap: 10px; padding: 14px; border-radius: 14px; background: var(--surface); border: 1px solid var(--border); }
.tip .ico { color: var(--lvl-i); }
.credit { margin: 16px 2px 0; color: var(--muted); font-size: 12px; }

/* ---------- Трекер підходів ---------- */
.tracker { padding: 16px; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); }
.tracker-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.tracker-head .block-title { flex: 1; margin: 0; }
.stepper { display: flex; align-items: center; gap: 2px; border-radius: 12px; background: var(--surface-2); }
.stepper .icon-btn { width: 40px; height: 40px; }
.stepper b { min-width: 74px; text-align: center; font-size: 14px; }
.dots { display: flex; gap: 6px; margin-bottom: 12px; }
.dot { flex: 1; height: 8px; border-radius: 4px; background: var(--surface-2); transition: background .3s; }
.dot.done { background: var(--accent); }
.dot.cur { background: var(--accent-line); animation: pulse 1.2s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .45; } }
.tracker-status { margin: 0 0 14px; font-size: 15px; }
.tracker-status b { font-size: 18px; display: block; }

/* ---------- Комплекси ---------- */
.prog-list { display: grid; gap: 10px; }
.prog-card {
  display: flex; align-items: center; gap: 12px; padding: 14px;
  border-radius: 16px; border: 1px solid var(--border); background: var(--surface);
  text-decoration: none; transition: transform .15s;
}
.prog-card.cp { border-color: rgba(255, 200, 97, .35); }
.prog-ico { width: 48px; height: 48px; flex: none; display: grid; place-items: center; border-radius: 14px; background: var(--surface-2); color: var(--accent); }
.prog-card.cp .prog-ico { color: var(--gold); background: var(--gold-soft); }
.prog-text { flex: 1; min-width: 0; }
.prog-text b { display: block; font-size: 16px; }
.prog-text span { display: block; color: var(--muted); font-size: 13px; }
.insp {
  margin-top: 12px; padding: 16px; border-radius: var(--radius);
  border: 1px solid rgba(255, 200, 97, .35); background: linear-gradient(160deg, var(--gold-soft), var(--surface) 70%);
}
.insp h3 { margin: 0 0 4px; font-size: 18px; }
.insp .disclaimer { color: var(--gold); font-size: 13px; margin: 0 0 12px; }
.insp ul { margin: 0; padding-left: 18px; display: grid; gap: 6px; font-size: 14px; }
.disclaimer-box {
  display: flex; gap: 10px; margin-top: 12px; padding: 12px; border-radius: 14px;
  background: var(--gold-soft); color: var(--gold); font-size: 13px;
}
.disclaimer-box .ico { width: 20px; height: 20px; }
details.tech { margin-top: 12px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); }
details.tech summary { min-height: 52px; padding: 0 16px; display: flex; align-items: center; cursor: pointer; font-weight: 600; list-style: none; }
details.tech summary::-webkit-details-marker { display: none; }
details.tech summary::after { content: "+"; margin-left: auto; color: var(--muted); font-size: 22px; }
details.tech[open] summary::after { content: "−"; }
details.tech dl { margin: 0; padding: 0 16px 16px; display: grid; gap: 10px; font-size: 14px; }
details.tech dt { font-weight: 700; color: var(--accent); }
details.tech dd { margin: 2px 0 0; color: var(--muted); }

.item-list { display: grid; gap: 10px; counter-reset: it; }
.item {
  border-radius: 16px; border: 1px solid var(--border); background: var(--surface); overflow: hidden;
}
.item-main { display: flex; gap: 12px; align-items: center; padding: 10px; text-decoration: none; }
.item-main .thumb { width: 64px; height: 64px; }
.item-num {
  width: 28px; height: 28px; flex: none; display: grid; place-items: center;
  border-radius: 50%; background: var(--surface-2); color: var(--muted); font-size: 13px; font-weight: 700;
}
.item-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.item-text b { font-size: 15px; line-height: 1.25; }
.item-target { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.item-target span { color: var(--muted); font-weight: 500; }
.badges { display: flex; flex-wrap: wrap; gap: 4px; }
.badge {
  display: inline-flex; align-items: center; gap: 4px; min-height: 22px; padding: 0 8px;
  border-radius: 999px; font-size: 11px; font-weight: 700; background: var(--surface-2); color: var(--muted);
}
.badge.tech { background: var(--accent-soft); color: var(--accent); }
.badge.warm { background: rgba(126, 224, 161, .12); color: var(--lvl-b); }
.badge.video { background: var(--gold-soft); color: var(--gold); }
.badge.swap { background: rgba(149, 158, 169, .14); }
.badge .ico { width: 12px; height: 12px; }
.item-actions { display: flex; gap: 8px; align-items: center; padding: 0 10px 10px 50px; flex-wrap: wrap; }
.check {
  display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px;
  border-radius: 12px; background: var(--surface-2); font-size: 13px; cursor: pointer;
}
.check input { width: 18px; height: 18px; accent-color: var(--gold); margin: 0; }
.field { display: grid; gap: 6px; margin-top: 12px; }
.field span { color: var(--muted); font-size: 13px; }
.field input {
  min-height: 48px; padding: 0 14px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text); outline: 0;
}
.field input:focus { border-color: var(--accent-line); }
.field small { color: var(--danger); font-size: 12px; }
.src-box { padding: 14px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); }
.src-box .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 10px; }
.sticky-cta {
  position: sticky; bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 8px); z-index: 5;
  margin-top: 20px;
}
body.has-timer .sticky-cta { position: static; }
.sticky-cta .btn { box-shadow: 0 10px 30px rgba(0, 0, 0, .5); }

.day-list { display: grid; gap: 8px; }
.day {
  display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: center;
  padding: 12px; border-radius: 14px; border: 1px solid var(--border); background: var(--surface);
}
.day.today { border-color: var(--accent); background: linear-gradient(160deg, var(--accent-soft), var(--surface) 70%); }
.day-name { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px; background: var(--surface-2); font-weight: 800; }
.day.today .day-name { background: var(--accent); color: var(--accent-ink); }
.day-body b { display: block; }
.day-body span { color: var(--muted); font-size: 13px; }
.day-links { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.note-box { margin-top: 12px; padding: 12px 14px; border-radius: 14px; background: var(--surface-2); font-size: 14px; }

.run-progress { display: flex; align-items: center; gap: 10px; margin: 4px 0 12px; font-size: 14px; color: var(--muted); }
.run-bar { flex: 1; height: 6px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.run-bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; transition: width .3s; }
.run-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
.done-card { text-align: center; padding: 28px 16px; border-radius: var(--radius); border: 1px solid var(--accent-line); background: linear-gradient(160deg, var(--accent-soft), var(--surface) 70%); }
.done-card .ico { width: 48px; height: 48px; color: var(--accent); }
.done-card h2 { margin: 8px 0 4px; }
.done-card p { color: var(--muted); margin: 0 0 16px; }
.done-card .btn + .btn { margin-top: 8px; }

/* ---------- Нижня навігація ---------- */
.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: flex; justify-content: center;
  padding-bottom: env(safe-area-inset-bottom);
  background: rgba(16, 19, 23, .94);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--border);
}
.bottom-nav .in { display: grid; grid-template-columns: repeat(5, 1fr); width: 100%; max-width: 560px; }
.bottom-nav a {
  position: relative; height: var(--nav-h);
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  color: var(--muted); font-size: 10.5px; font-weight: 600; text-decoration: none;
}
.bottom-nav a.on { color: var(--accent); }
.bottom-nav a.on .ico-star { fill: currentColor; }
.nav-badge {
  position: absolute; top: 8px; left: calc(50% + 6px);
  min-width: 18px; height: 18px; padding: 0 5px;
  border-radius: 9px; background: var(--accent); color: var(--accent-ink);
  font-size: 11px; font-style: normal; line-height: 18px; text-align: center;
}
.nav-badge:empty { display: none; }

/* ---------- Таймер ---------- */
.timer {
  position: fixed; left: 0; right: 0; z-index: 30;
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom));
  max-width: 560px; margin: 0 auto; padding: 14px 16px 16px;
  border: 1px solid var(--border); border-bottom: 0; border-radius: 22px 22px 0 0;
  background: var(--surface-2); box-shadow: 0 -16px 40px rgba(0, 0, 0, .55);
  transform: translateY(105%); visibility: hidden;
  transition: transform .3s ease, visibility 0s .3s;
}
.timer.show { transform: none; visibility: visible; transition: transform .3s ease; }
.timer-main { display: flex; align-items: center; gap: 14px; }
.ring { position: relative; width: 96px; height: 96px; flex: none; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 8; }
.ring-bg { stroke: var(--border); }
.ring-fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
.timer.hold .ring-fg { stroke: var(--gold); }
.ring-time {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em;
}
.timer-info { flex: 1; min-width: 0; }
.timer-info small { display: block; color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; }
.timer.hold .timer-info small { color: var(--gold); }
.timer-info b { display: block; font-size: 18px; margin: 2px 0; }
.timer-info span { display: block; color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.timer-btns { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 8px; margin-top: 14px; }
.timer-btns .btn { min-height: 48px; font-size: 15px; }
.timer .done-btns { display: none; margin-top: 14px; }
.timer.done .run-btns { display: none; }
.timer.done .done-btns { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.timer.done .done-btns .btn.secondary { width: auto; }
.timer.done .ring-fg { animation: pulse 1s ease-in-out infinite; }
.timer.done .timer-info small { color: var(--accent); }

/* ---------- Модальні вікна ---------- */
.modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.modal-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, .6); }
.modal-card {
  position: relative; width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto;
  padding: 20px 16px calc(20px + env(safe-area-inset-bottom));
  border-radius: 22px 22px 0 0; background: var(--surface-2);
  animation: up .25s ease;
}
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.modal-card h3 { margin: 0 0 4px; font-size: 20px; }
.modal-card .sub { margin: 0 0 14px; color: var(--muted); font-size: 14px; }
.modal-card .ex-card { background: var(--surface); }
.modal-card .ex-card.current { border-color: var(--accent-line); }
.set-row { display: flex; align-items: center; gap: 12px; min-height: 56px; border-bottom: 1px solid var(--border); }
.set-row > span { flex: 1; }
.set-row small { display: block; color: var(--muted); font-size: 13px; }
.switch {
  position: relative; width: 52px; height: 32px; flex: none;
  border: 0; border-radius: 16px; background: var(--border); cursor: pointer; transition: background .2s;
}
.switch::after {
  content: ""; position: absolute; top: 4px; left: 4px;
  width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s;
}
.switch[aria-checked="true"] { background: var(--accent); }
.switch[aria-checked="true"]::after { transform: translateX(20px); background: var(--accent-ink); }
.modal-card > .btn { margin-top: 20px; }
.link-btn { margin-top: 12px; width: 100%; min-height: 44px; border: 0; background: transparent; color: var(--muted); cursor: pointer; text-decoration: underline; }
.about { margin-top: 16px; color: var(--muted); font-size: 12px; }

/* ---------- Мої тренування (у стилі Hevy) ---------- */
.my-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.my-actions .btn { font-size: 14px; padding: 0 10px; }
button.row-link { width: 100%; text-align: left; cursor: pointer; color: inherit; font: inherit; font-weight: 600; }
.block-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.block-row .section-title { margin: 24px 0 8px; }
.section-title small { color: var(--muted); font-size: 14px; font-weight: 600; }
.muted-line { color: var(--muted); font-size: 14px; margin: 4px 2px; }
.row-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 16px; }
.btn.danger { background: var(--danger); color: #fff; }
.link-btn.danger { color: var(--danger); }
.topbar .btn.small { margin-right: 4px; }
.field select, .ed-field select, .ed-field input {
  min-height: 44px; padding: 0 10px; border-radius: 12px; width: 100%;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font: inherit; outline: 0;
}
.field select { min-height: 48px; }
.ed-field input:focus, .ed-field select:focus { border-color: var(--accent-line); }
.ed-ex { margin-top: 10px; padding: 12px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); }
.ed-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 10px; }
.ed-field { display: grid; gap: 4px; min-width: 0; }
.ed-field span { color: var(--muted); font-size: 12px; }
.ed-ex .ed-field.note { margin-top: 8px; }
.mini-btns { display: flex; gap: 2px; flex: none; }
.mini-btns .icon-btn { width: 36px; height: 36px; }
.field-err { color: var(--danger); font-size: 14px; margin: 10px 2px 0; }

.log-head {
  position: sticky; top: 60px; z-index: 10;
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
  margin: 0 -16px; padding: 8px 16px 10px; background: rgba(12, 14, 17, .94);
  border-bottom: 1px solid var(--border);
}
.log-stat { text-align: center; }
.log-stat b { display: block; font-size: 18px; font-variant-numeric: tabular-nums; }
.log-stat span { color: var(--muted); font-size: 12px; }
.log-ex { margin-top: 14px; padding: 12px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); }
.log-ex-head { display: flex; align-items: center; gap: 10px; }
.log-ex-head .thumb { width: 52px; height: 52px; }
.log-ex-head > a, .log-ex-head > .grow { flex: 1; min-width: 0; text-decoration: none; }
.log-ex-head b { display: block; font-size: 16px; line-height: 1.25; }
.log-ex-head > a b { color: var(--accent); }
.log-meta { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; justify-content: space-between; margin: 10px 0 4px; font-size: 13px; color: var(--muted); }
.log-meta label { display: inline-flex; align-items: center; gap: 6px; }
.log-meta select {
  min-height: 36px; padding: 0 8px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--surface-2); color: var(--accent); font: inherit; font-weight: 700;
}
.log-note { margin: 4px 0 6px; font-size: 13px; color: var(--gold); }
.set-table { width: 100%; border-collapse: separate; border-spacing: 0 4px; font-variant-numeric: tabular-nums; }
.set-table th { padding: 4px 2px; color: var(--muted); font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; text-align: center; }
.set-table td { padding: 2px; text-align: center; }
.set-table tr.done td { background: rgba(198, 243, 94, .09); }
.set-table tr.done td:first-child { border-radius: 10px 0 0 10px; }
.set-table tr.done td:last-child { border-radius: 0 10px 10px 0; }
.set-num { width: 36px; font-weight: 800; }
.set-prev { color: var(--muted); font-size: 13px; white-space: nowrap; }
.set-table input {
  width: 100%; max-width: 74px; min-height: 40px; padding: 0 4px;
  border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2);
  color: var(--text); font: inherit; font-size: 16px; font-weight: 700; text-align: center; outline: 0;
}
.set-table input:focus { border-color: var(--accent-line); }
.set-table input::placeholder { color: #5d6570; }
.set-table input.need { border-color: var(--danger); }
.set-check {
  width: 44px; height: 40px; display: grid; place-items: center;
  border: 0; border-radius: 10px; background: var(--surface-2); color: var(--muted); cursor: pointer;
}
tr.done .set-check { background: var(--accent); color: var(--accent-ink); }
.pr { color: var(--gold); font-size: 10px; font-weight: 800; letter-spacing: .04em; }
.log-actions { display: flex; gap: 8px; margin-top: 6px; }

.pick-row {
  width: 100%; display: flex; align-items: center; gap: 12px; padding: 8px;
  border-radius: 14px; border: 1px solid var(--border); background: var(--surface);
  color: inherit; font: inherit; text-align: left; cursor: pointer;
}
.pick-row .thumb { width: 56px; height: 56px; }
.pick-row .ex-text { flex: 1; }
.pick-check {
  width: 28px; height: 28px; flex: none; display: grid; place-items: center;
  border-radius: 50%; border: 2px solid var(--border); color: transparent;
}
.pick-check .ico { width: 16px; height: 16px; }
.pick-row.on { border-color: var(--accent-line); }
.pick-row.on .pick-check { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
#pickList { display: grid; gap: 8px; margin-top: 12px; }
.pick-foot {
  position: sticky; bottom: calc(-20px - env(safe-area-inset-bottom)); z-index: 2;
  margin: 12px -16px calc(-20px - env(safe-area-inset-bottom)); padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
  background: var(--surface-2); border-top: 1px solid var(--border);
}

.active-bar {
  position: fixed; left: 0; right: 0; z-index: 25;
  bottom: calc(var(--nav-h) + env(safe-area-inset-bottom));
  max-width: 560px; margin: 0 auto; padding: 0 12px 8px;
}
.active-bar a {
  display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 16px;
  border-radius: 14px; background: var(--accent); color: var(--accent-ink);
  font-weight: 700; text-decoration: none; box-shadow: 0 8px 24px rgba(0, 0, 0, .5);
}
.active-bar small { margin-left: auto; font-size: 15px; font-variant-numeric: tabular-nums; }
body.has-active .app { padding-bottom: calc(var(--nav-h) + env(safe-area-inset-bottom) + 90px); }
body.has-timer .active-bar { display: none; }
.timer.log #tStart { display: none; }
.timer.log.done .done-btns { grid-template-columns: 1fr; }
.timer.log .done-btns .btn.secondary { width: 100%; }

/* ---------- Календар історії ---------- */
.cal-nav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 4px; }
.cal-nav h2 { margin: 0; font-size: 20px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; margin-top: 8px; }
.cal-wd { padding: 4px 0; text-align: center; color: var(--muted); font-size: 11px; font-weight: 700; }
.cal-day {
  min-height: 56px; padding: 6px 2px 5px; min-width: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: space-between; gap: 3px;
  border-radius: 10px; border: 1px solid transparent; background: var(--surface);
  color: inherit; font: inherit; cursor: pointer;
}
.cal-day.out { visibility: hidden; }
.cal-day .n { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
.cal-day.future .n { color: var(--muted); }
.cal-day.today { border-color: var(--accent-line); }
.cal-day.today .n { color: var(--accent); }
.cal-day.sel { border-color: var(--accent); background: var(--accent-soft); }
.cal-day.dim .cal-dots { opacity: .2; }
.cal-dots { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px; min-height: 7px; }
.cal-dots i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.cal-dots small { color: var(--muted); font-size: 9px; line-height: 7px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
.legend button {
  min-height: 36px; padding: 0 10px; display: inline-flex; align-items: center; gap: 6px;
  border-radius: 999px; border: 1px solid var(--border); background: var(--surface);
  color: inherit; font: inherit; font-size: 13px; cursor: pointer;
}
.legend button.on { border-color: var(--c); box-shadow: inset 0 0 0 1px var(--c); }
.gdot, .gdots i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--c); margin-right: 4px; vertical-align: 1px; }
.gdots { color: var(--muted); font-size: 12px; }
.day-card { margin-top: 10px; padding: 14px; border-radius: 16px; border: 1px solid var(--border); background: var(--surface); }
.day-card h3 { margin: 0; font-size: 17px; }
.day-card > a { text-decoration: none; }
.day-card .meta { margin: 2px 0 8px; color: var(--muted); font-size: 13px; }
.gsec { margin-top: 12px; padding-left: 10px; border-left: 3px solid var(--c); }
.gsec h4 { display: flex; justify-content: space-between; gap: 8px; margin: 0 0 6px; font-size: 14px; }
.gsec h4 span { color: var(--muted); font-weight: 500; }
.gsec ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; font-size: 14px; }
.gsec li a { text-decoration: none; font-weight: 600; }
.gsec li span { color: var(--muted); font-size: 13px; }
.gstat-list { display: grid; gap: 8px; }
details.gstat { border-radius: 12px; border: 1px solid var(--border); background: var(--surface); }
details.gstat summary { padding: 10px 12px; list-style: none; cursor: pointer; }
details.gstat summary::-webkit-details-marker { display: none; }
details.gstat summary small { display: block; margin-top: 4px; color: var(--muted); font-size: 12px; }
.gbar-row { display: grid; grid-template-columns: 104px 1fr 36px; gap: 8px; align-items: center; font-size: 13px; }
.gbar-row b { text-align: right; font-variant-numeric: tabular-nums; }
.gbar { height: 10px; border-radius: 5px; background: var(--surface-2); overflow: hidden; }
.gbar i { display: block; height: 100%; border-radius: 5px; background: var(--c); }
details.gstat ul { margin: 0; padding: 0 12px 12px; list-style: none; display: grid; gap: 6px; font-size: 13px; }
details.gstat li { display: flex; justify-content: space-between; gap: 8px; }
details.gstat li span { color: var(--muted); white-space: nowrap; }

/* ---------- Дані: зберегти / вставити ---------- */
.field textarea {
  min-height: 120px; padding: 10px 12px; border-radius: 12px; resize: vertical; outline: 0;
  border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
  font: 13px/1.4 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
.field textarea:focus { border-color: var(--accent-line); }
.radio-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.radio-row input { accent-color: var(--accent); }
.msg-ok { color: var(--accent); }
.msg-err { color: var(--danger); }

/* ---------- Повідомлення ---------- */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 60;
  top: calc(12px + env(safe-area-inset-top));
  width: max-content; max-width: min(520px, calc(100% - 32px));

  border: 1px solid var(--accent-line); background: var(--surface-2); color: var(--text);

}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; animation: none !important; }
}

  floor: '<line class="sg" x1="8" y1="188" x2="312" y2="188"/>',
  f: p => `<polyline class="sf" points="${p}"/>`,
  b: p => `<polyline class="sb" points="${p}"/>`,
  m: p => `<polyline class="sm" points="${p}"/>`,
  c: p => `<polyline class="sc" points="${p}"/>`,
  h: (x, y) => `<circle class="sb" cx="${x}" cy="${y}" r="9"/>`,
  r: (x, y, w, h, cls = 'sp') => `<rect class="${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="3"/>`,
  o: (x, y, r, cls = 'sp') => `<circle class="${cls}" cx="${x}" cy="${y}" r="${r}"/>`,
  a(x1, y1, x2, y2) {
    const ang = Math.atan2(y2 - y1, x2 - x1), l = 9;
    const p1 = [x2 - l * Math.cos(ang - .5), y2 - l * Math.sin(ang - .5)], p2 = [x2 - l * Math.cos(ang + .5), y2 - l * Math.sin(ang + .5)];

  },
  l(x, y, tx, ty, text, anchor) {
    const an = anchor || (tx < x ? 'end' : 'start');
    const lines = text.split('|');
    const tsp = lines.map((t, i) => `<tspan x="${tx + (an === 'end' ? -4 : an === 'start' ? 4 : 0)}" dy="${i ? 13 : 0}">${t}</tspan>`).join('');

/* ---------- Стан і localStorage ---------- */
const STORE_KEY = 'sila.v2';
const DEFAULT_REST = { strength: 150, hypComp: 105, hypIso: 60, endurance: 45 };
const state = loadState();

function loadState() {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(STORE_KEY)); } catch (e) { /* localStorage недоступний — працюємо зі значеннями за замовчуванням */ }
  return sanitizeState(saved);
}
// Перевіряє й очищує дані — і з localStorage, і з імпортованого файлу
function sanitizeState(saved) {
  const base = { place: 'gym', goal: 'hypertrophy', favs: [], favPrograms: [], sound: true, vibrate: true, rest: { ...DEFAULT_REST }, addVacuum: false, prog: {},
    routines: [], history: [], active: null };
  const known = id => EXERCISES.some(e => e.id === id);
  try {
    if (saved && typeof saved === 'object') {
      if (PLACES[saved.place]) base.place = saved.place;
      if (GOALS[saved.goal]) base.goal = saved.goal;
      if (Array.isArray(saved.favs)) base.favs = saved.favs.filter(id => EXERCISES.some(e => e.id === id));
      if (Array.isArray(saved.favPrograms)) base.favPrograms = saved.favPrograms.filter(id => PROGRAMS.some(p => p.id === id));
      for (const k of ['sound', 'vibrate', 'addVacuum']) if (typeof saved[k] === 'boolean') base[k] = saved[k];
      if (saved.rest) for (const g in DEFAULT_REST) if (Number.isFinite(saved.rest[g])) base.rest[g] = saved.rest[g];
      if (saved.prog && typeof saved.prog === 'object') base.prog = saved.prog;
      if (Array.isArray(saved.routines)) base.routines = saved.routines.filter(r => r && r.id && Array.isArray(r.exercises))
        .map(r => ({ ...r, exercises: r.exercises.filter(x => known(x.exerciseId)) }));
      if (Array.isArray(saved.history)) base.history = saved.history.filter(h => h && h.id && Array.isArray(h.exercises))
        .map(h => ({ ...h, exercises: h.exercises.filter(x => known(x.exerciseId)) }));
      if (saved.active && Array.isArray(saved.active.exercises)) base.active = { ...saved.active, exercises: saved.active.exercises.filter(x => known(x.exerciseId)) };
      base.history = base.history.filter(h => Number.isFinite(h.startedAt)).sort((a, b) => b.startedAt - a.startedAt);
    }
  } catch (e) { /* пошкоджені дані — повертаємо значення за замовчуванням */ }
  return base;
}
function saveState() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* ігноруємо */ }
}

/* ---------- Допоміжні ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const byId = Object.fromEntries(EXERCISES.map(e => [e.id, e]));
const progById = Object.fromEntries(PROGRAMS.map(p => [p.id, p]));
const groupById = Object.fromEntries(GROUPS.map(g => [g.id, g]));
const reduceMotion = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;

function plural(n, forms) {
  const a = n % 10, b = n % 100;
  return forms[a === 1 && b !== 11 ? 0 : a >= 2 && a <= 4 && (b < 10 || b >= 20) ? 1 : 2];
}
const exWord = n => plural(n, ['вправа', 'вправи', 'вправ']);
const setWord = n => plural(n, ['підхід', 'підходи', 'підходів']);
const fmtClock = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
const fmtRest = s => !s ? 'без відпочинку' : s < 60 ? s + ' с' : (s % 60 ? fmtClock(s) + ' хв' : s / 60 + ' хв');
const isFav = id => state.favs.includes(id);
const isFavProg = id => state.favPrograms.includes(id);
const norm = s => s.toLowerCase().replace(/[’'ʼ`]/g, '');
const subName = e => { const g = groupById[e.muscleGroup]; const s = g.subs && g.subs.find(x => x[0] === e.subgroup); return s ? s[1] : g.name; };
const isMachine = e => MACHINE_EQ.includes(e.equipment);
const todayIdx = () => (new Date().getDay() + 6) % 7;

function recFor(e) {
  const g = GOALS[state.goal];
  const r = state.goal === 'hypertrophy' && e && g[e.type] ? g[e.type] : g;
  return { sets: r.sets, reps: e && e.unit === 'sec' ? g.timed : r.reps, rest: r.rest };
}
function restSecFor(e) {
  if (state.goal === 'strength') return state.rest.strength;
  if (state.goal === 'endurance') return state.rest.endurance;
  return e && e.type === 'isolation' ? state.rest.hypIso : state.rest.hypComp;
}
const holdSecFor = e => e.hold || GOALS[state.goal].hold;

/* ---------- Комплекси: правки користувача ---------- */
function progEdit(pid) { return state.prog[pid] || (state.prog[pid] = { sourceUrl: '', verified: null, items: {} }); }
function progItems(p) {
  const ed = state.prog[p.id] || { items: {} };
  return (p.exercises || []).map((it, i) => {
    const o = (ed.items || {})[i] || {};
    return { ...it, index: i, originalId: it.exerciseId, exerciseId: o.exerciseId && byId[o.exerciseId] ? o.exerciseId : it.exerciseId, verified: typeof o.verified === 'boolean' ? o.verified : !!it.verified };
  });
}
const progSource = p => (state.prog[p.id] && state.prog[p.id].sourceUrl) || p.sourceUrl || '';
const progVerified = p => { const v = state.prog[p.id] && state.prog[p.id].verified; return typeof v === 'boolean' ? v : !!p.verified; };
const validUrl = u => /^https?:\/\/[^\s]+$/i.test(u);

/* ---------- Маршрутизація ---------- */
let route = { name: 'home' };
const navStack = [];
const ui = { q: '', eq: 'all', lvl: 'all', type: 'all', machinesOnly: false, cfg: null, weekMsg: '' };

function parseRoute() {
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
  if (!parts.length) return { name: 'home' };
  if (parts[0] === 'favorites') return { name: 'favorites' };
  if (parts[0] === 'my') return { name: 'my' };
  if (parts[0] === 'edit') return { name: 'edit' };
  if (parts[0] === 'workout') return { name: 'workout' };
  if (parts[0] === 'calendar') return { name: 'calendar' };
  if (parts[0] === 'shared') return { name: 'shared', tok: parts[1] || '' };
  if (parts[0] === 'data') return { name: 'data' };
  if (parts[0] === 'routine' && parts[1]) return { name: 'routine', id: parts[1] };
  if (parts[0] === 'history') return parts[1] ? { name: 'historyItem', id: parts[1] } : { name: 'history' };
  if (parts[0] === 'programs') return { name: 'programs' };
  if (parts[0] === 'program' && progById[parts[1]]) return { name: 'program', id: parts[1] };
  if (parts[0] === 'run' && progById[parts[1]] && progById[parts[1]].type === 'workout') return { name: 'run', id: parts[1] };
  if (parts[0] === 'exercise' && byId[parts[1]]) return { name: 'exercise', id: parts[1] };
  if (PLACES[parts[0]]) {
    if (!parts[1]) return { name: 'groups', place: parts[0] };
    if (parts[1] === 'all') return { name: 'list', place: parts[0], group: 'all', sub: null };
    const g = groupById[parts[1]];
    if (g) {
      const sub = g.subs && g.subs.some(s => s[0] === parts[2]) ? parts[2] : null;
      return { name: 'list', place: parts[0], group: g.id, sub };
    }
  }
  return { name: 'home' };
}
function parentOf(r) {
  if (['routine', 'edit', 'workout', 'history', 'calendar', 'data', 'shared'].includes(r.name)) return '#/my';
  if (r.name === 'historyItem') return '#/history';
  if (r.name === 'groups' || r.name === 'programs') return '#/';
  if (r.name === 'list') return r.sub ? `#/${r.place}/${r.group}` : '#/' + r.place;
  if (r.name === 'program') return '#/programs';
  if (r.name === 'run') return '#/program/' + r.id;
  if (r.name === 'exercise') {
    const e = byId[r.id];
    const p = e.place.includes(state.place) ? state.place : e.place[0];
    return `#/${p}/${e.muscleGroup}` + (groupById[e.muscleGroup].subs ? '/' + e.subgroup : '');
  }
  return '#/';
}
function trackNav() {
  const h = location.hash || '#/';
  if (navStack.length > 1 && navStack[navStack.length - 2] === h) navStack.pop();
  else if (navStack[navStack.length - 1] !== h) navStack.push(h);
}
function goBack() {
  if (navStack.length > 1) history.back();
  else { navStack.length = 0; location.replace(parentOf(route)); }
}

function statsHtml(e) {
  const g = GOALS[state.goal];
  const r = recFor(e);
  const timed = e && e.unit === 'sec';
  let html = `<div class="stats">
    <div class="stat"><b>${r.sets}</b><span>підходи</span></div>
    <div class="stat"><b>${r.reps}</b><span>${timed ? 'утримання' : 'повторення'}</span></div>
    <div class="stat"><b>${r.rest}</b><span>відпочинок</span></div></div>`;
  if (state.goal === 'hypertrophy' && !timed) {
    const line = t => `<div class="stat-line ${e && e.type === t ? 'on' : ''}"><span>${t === 'compound' ? 'Базові (жими, тяги, присідання)' : 'Ізолюючі на тренажерах і блоках'}</span><b>${g[t].sets} × ${g[t].reps} · ${g[t].rest}</b></div>`;
    html += `<div class="stat-split">${line('compound')}${line('isolation')}</div>`;
  }
  return html + `<p class="goal-note">${g.full}: ${g.note}</p>`;
}
function thumbImg(e) {
  if (!e) return '';
  if (!e.images.length) return schemeSvg(e) + '<span class="thumb-tag">СХЕМА</span>';

}

function mediaHtml(e) {
  if (!e.images.length) {
    return `<figure class="media scheme" id="media">${schemeSvg(e)}<span class="frame-tag">Схема</span></figure>
      <p class="media-hint">Реального фото цього тренажера немає у відкритих базах — показано схему.</p>`;
  }
  const single = e.images.length === 1;
  const ph = `<div class="ph"><span class="ph-ico">${EQUIP[e.equipment].ico}</span><b>${esc(e.name)}</b><small>Зображення недоступне. Перевір підключення до інтернету.</small></div>`;
  if (single) {
    return `<figure class="media single" id="media"><img class="f on" data-i="0" src="${e.images[0]}" alt="${esc(e.name)}" onerror="mediaErr(this)">${ph}</figure>`;
  }
  return `<figure class="media" id="media" data-act="frame">
      <img class="f on" data-i="0" src="${e.images[0]}" alt="${esc(e.name)}: початкова позиція" onerror="mediaErr(this)">
      <img class="f" data-i="1" src="${e.images[1]}" alt="${esc(e.name)}: кінцева позиція" loading="lazy" onerror="mediaErr(this)">
      ${ph}
      <span class="frame-tag" id="frameTag">Старт</span>
      <button class="media-btn" data-act="anim" id="animBtn" aria-label="${anim.paused ? 'Відтворити анімацію' : 'Пауза анімації'}">${anim.paused ? ICON.play : ICON.pause}</button>
    </figure>
    <p class="media-hint" id="mediaHint">${anim.paused ? 'Торкнись зображення, щоб перемкнути кадр' : 'Кадри чергуються: старт → фініш руху'}</p>`;
}
const creditText = e => !e.images.length ? 'Ілюстрація: схема тренажера.' : e.credit ? 'Фото: ' + e.credit : 'Фото: free-exercise-db (Unlicense).';

/* ---------- Екрани ---------- */
const SCREENS = {
  home() {
    const count = p => EXERCISES.filter(e => e.place.includes(p)).length;
    const week = progById['cp-week'];
    const day = week.days[todayIdx()];
    return {
      head: topbar({ title: 'Сила<span>.</span>', brand: true, action: `<button class="icon-btn" data-act="settings" aria-label="Налаштування">${ICON.gear}</button>` }),
      body: `
        <section class="hero"><p class="eyebrow">Тренажери · гіпертрофія</p><h2>Де тренуєшся сьогодні?</h2></section>
        <div class="place-grid">
          ${Object.entries(PLACES).map(([id, p]) => `
            <a class="place-card ${state.place === id ? 'is-active' : ''}" href="#/${id}">
              <span class="place-ico">${id === 'home' ? ICON.house : ICON.gym}</span>
              <span class="place-name">${p.name}</span>
              <span class="place-desc">${p.desc}</span>
              <span class="place-count">${count(id)} ${exWord(count(id))}</span>
            </a>`).join('')}
        </div>
        <section class="block">
          <h3 class="block-title">${ICON.target} Твоя ціль</h3>
          ${goalSeg()}
          ${statsHtml()}
        </section>
        <a class="row-link today" href="#/program/cp-week">${ICON.cal}<span class="grow">Сьогодні: ${esc(day.label)} — ${esc(day.title)}<small>Тижневий план Classic Physique</small></span>${ICON.chev}</a>
        ${installCardHtml()}
        <button class="row-link" data-act="app-share">${ICON.share}<span class="grow">Поділитися з родиною<small>Надішли посилання на застосунок</small></span>${ICON.chev}</button>
        <a class="row-link" href="#/my">${ICON.gym}<span class="grow">Мої тренування<small>${state.routines.length} ${plural(state.routines.length, ['шаблон', 'шаблони', 'шаблонів'])} · журнал ваги й повторень</small></span>${ICON.chev}</a>
        <a class="row-link" href="#/programs">${ICON.prog}<span class="grow">Комплекси на тренажерах<small>Окремі тренування, спліти, Classic Physique</small></span>${ICON.chev}</a>
        <a class="row-link" href="#/favorites">${ICON.star}<span class="grow">Обране</span><span class="badge">${state.favs.length + state.favPrograms.length}</span>${ICON.chev}</a>`
    };
  },

  groups(r) {
    const pool = EXERCISES.filter(e => e.place.includes(r.place));
    return {
      head: topbar({ title: PLACES[r.place].name, back: true }),
      body: `
        ${placeSeg(id => '#/' + id)}
        <a class="search" href="#/${r.place}/all">${ICON.search}<span class="ph-text">Пошук серед усіх вправ</span></a>
        <div class="group-grid">
          ${GROUPS.map(g => {
            const ex = pool.filter(e => e.muscleGroup === g.id);
            const cover = ex.find(e => e.images.length && isMachine(e)) || ex.find(e => e.images.length) || ex[0];
            const subs = g.big ? `<div class="sub-links">${g.subs.map(([sid, sn]) => {
              const n = ex.filter(e => e.subgroup === sid).length;
              return `<a href="#/${r.place}/${g.id}/${sid}">${sn} <small>${n}</small></a>`;
            }).join('')}</div>` : '';
            return `<div class="group-card ${g.big ? 'big' : ''}">
              <a href="#/${r.place}/${g.id}" style="text-decoration:none">
                <div class="group-img">${thumbImg(cover)}</div>
                <div class="group-info"><b>${g.name}</b><span>${ex.length} ${exWord(ex.length)}${r.place === 'gym' ? ` · ${ex.filter(isMachine).length} на тренажерах` : ''}</span></div>
              </a>${subs}</div>`;
          }).join('')}
        </div>`
    };
  },

  list(r) {
    const g = groupById[r.group];
    const pool = EXERCISES.filter(e => e.place.includes(r.place));
    const eqs = Object.keys(EQUIP).filter(k => pool.some(e => e.equipment === k));
    if (!eqs.includes(ui.eq)) ui.eq = 'all';
    const title = r.group === 'all' ? 'Усі вправи' : r.sub ? g.subs.find(s => s[0] === r.sub)[1] : g.name;
    const base = `#/${r.place}/${r.group}`;
    return {
      head: topbar({ title: title + ' · ' + PLACES[r.place].name, back: true }),
      body: `
        ${placeSeg(id => `#/${id}/${r.group}${r.sub ? '/' + r.sub : ''}`)}
        <label class="search">${ICON.search}<input id="q" type="search" placeholder="Назва (укр. або англ.) чи м’яз" value="${esc(ui.q)}" autocomplete="off" enterkeyhint="search" aria-label="Пошук вправ"></label>
        <label class="select"><span>Група</span>
          <select id="fgroup" aria-label="Група м’язів">
            <option value="all">Усі групи</option>
            ${GROUPS.map(x => `<option value="${x.id}" ${x.id === r.group ? 'selected' : ''}>${x.name}</option>`).join('')}
          </select>
        </label>
        ${g && g.subs ? `<div class="chips" role="group" aria-label="Підгрупа">
          <a class="chip ${!r.sub ? 'on' : ''}" href="${base}">Усі</a>
          ${g.subs.map(([sid, sn]) => `<a class="chip ${r.sub === sid ? 'on' : ''}" href="${base}/${sid}">${sn}</a>`).join('')}
        </div>` : ''}
        <div class="chips" role="group" aria-label="Тип і тренажери">
          ${r.place === 'gym' ? `<button class="chip toggle ${ui.machinesOnly ? 'on' : ''}" data-act="fmach" aria-pressed="${ui.machinesOnly}">${EQUIP.machine.ico}Лише тренажери</button>` : ''}
          ${['all', 'compound', 'isolation'].map(t => `<button class="chip ${ui.type === t ? 'on' : ''}" data-act="ftype" data-v="${t}">${t === 'all' ? 'Будь-який тип' : TYPES[t]}</button>`).join('')}
        </div>
        <div class="chips" role="group" aria-label="Обладнання">
          <button class="chip ${ui.eq === 'all' ? 'on' : ''}" data-act="feq" data-v="all">Усе обладнання</button>
          ${eqs.map(k => `<button class="chip ${ui.eq === k ? 'on' : ''}" data-act="feq" data-v="${k}">${EQUIP[k].ico}${EQUIP[k].name}</button>`).join('')}
        </div>
        <div class="chips" role="group" aria-label="Рівень">
          <button class="chip ${ui.lvl === 'all' ? 'on' : ''}" data-act="flvl" data-v="all">Будь-який рівень</button>
          ${Object.entries(LEVELS).map(([k, n]) => `<button class="chip ${ui.lvl === k ? 'on' : ''}" data-act="flvl" data-v="${k}">${n}</button>`).join('')}
        </div>
        <p class="count" id="count"></p>
        <div class="ex-list" id="results"></div>`,
      after() {
        $('#q').addEventListener('input', ev => { ui.q = ev.target.value; updateResults(); });
        $('#fgroup').addEventListener('change', ev => { location.hash = `#/${r.place}/${ev.target.value}`; });
        updateResults();
      }
    };
  },

  exercise(r) {
    const e = byId[r.id];
    const machine = isMachine(e);
    const hints = [];
    if (state.goal === 'strength' && e.equipment === 'bodyweight' && e.place.includes('home')) {
      hints.push('Власної ваги замало для силового режиму. Ускладни: додай обтяження, опускайся за 3–4 с або обери складнішу версію.');
    }
    if (state.goal === 'hypertrophy' && machine) {
      hints.push('Тренажер дає постійне навантаження — останні 1–2 повторення роби на межі відмови без ризику «завалити» вагу.');
    }
    const cfg = singleCfg(e);
    ui.cfg = cfg;
    return {
      head: topbar({ title: subName(e), back: true, action: favBtn(e.id) }),
      body: `
        ${mediaHtml(e)}
        <div class="ex-head">
          <h2>${esc(e.name)}</h2>
          <p class="aka">${esc(e.aka || '')}</p>
          <div class="tags">
            <span class="tag lvl lvl-${e.level}">${LEVELS[e.level]}</span>
            <span class="tag ${machine ? 'accent' : ''}">${EQUIP[e.equipment].ico}${EQUIP[e.equipment].name}</span>
            <span class="tag">${TYPES[e.type]}</span>
            ${e.place.map(p => `<span class="tag">${p === 'home' ? ICON.house : ICON.gym}${PLACES[p].name}</span>`).join('')}
          </div>
        </div>
        <section class="block">
          <h3 class="block-title">${ICON.target} Ціль</h3>
          ${goalSeg()}${statsHtml(e)}
          ${hints.map(h => `<p class="hint">${ICON.bulb}<span>${h}</span></p>`).join('')}
        </section>
        <section class="block tracker" id="tracker">${trackerHtml(cfg)}</section>
        <button class="btn secondary" style="margin-top:10px" data-act="my-add-ex" data-id="${e.id}">${ICON.plus} Додати в моє тренування</button>
        ${e.machineSetup ? `<section class="block setup">
          <h3 class="block-title">${ICON.setup} ${machine ? 'Налаштування тренажера' : 'Підготовка'}</h3>
          <ul class="checklist">${e.machineSetup.map(s => `<li>${ICON.check}<span>${esc(s)}</span></li>`).join('')}</ul>
        </section>` : ''}
        <section class="block">
          <h3 class="block-title">${ICON.muscle} М’язи</h3>
          <p class="m-label">Основні</p>
          <div class="mchips">${e.primaryMuscles.map(m => `<span class="mchip primary">${esc(m)}</span>`).join('')}</div>
          ${e.secondaryMuscles.length ? `<p class="m-label">Допоміжні</p><div class="mchips">${e.secondaryMuscles.map(m => `<span class="mchip">${esc(m)}</span>`).join('')}</div>` : ''}
        </section>
        ${e.variations ? `<section class="block"><h3 class="block-title">${ICON.vary} Варіації акценту</h3>
          <ul class="checklist variations">${e.variations.map(v => `<li>${ICON.vary}<span>${esc(v)}</span></li>`).join('')}</ul></section>` : ''}
        <section class="block">
          <h3 class="block-title">${ICON.steps} Техніка виконання</h3>
          <ol class="steps">${e.steps.map(s => `<li><span>${esc(s)}</span></li>`).join('')}</ol>
        </section>
        <section class="block mistakes">
          <h3 class="block-title">${ICON.alert} Типові помилки</h3>
          <ul>${e.mistakes.map(m => `<li>${ICON.x}<span>${esc(m)}</span></li>`).join('')}</ul>
        </section>
        ${e.tips ? `<section class="block"><div class="tip">${ICON.bulb}<span>${esc(e.tips)}</span></div></section>` : ''}
        <p class="credit">${esc(creditText(e))}</p>`,
      after() { startAnim(); }
    };
  },

  programs() {
    const cp = PROGRAMS.filter(p => p.inspiredBy && p.type === 'workout');
    const singles = PROGRAMS.filter(p => p.type === 'workout' && !p.inspiredBy && !p.split);
    const splits = PROGRAMS.filter(p => p.type === 'split');
    return {
      head: topbar({ title: 'Комплекси' }),
      body: `
        <h2 class="section-title">Тижневий план</h2>
        <div class="prog-list">${progCard(progById['cp-week'])}</div>
        <button class="btn" style="margin-top:10px" data-act="start-week">${ICON.play} Почати тиждень</button>
        ${ui.weekMsg ? `<p class="note-box">${ui.weekMsg}</p>` : ''}

        <h2 class="section-title">Натхнення: Kyrylo Khudaiev</h2>
        <div class="insp">
          <h3>Classic Physique</h3>
          <p class="disclaimer">${CP_NOTE}</p>
          <ul>${CP_PRINCIPLES.map(t => `<li>${t}</li>`).join('')}</ul>
        </div>
        <div class="prog-list" style="margin-top:10px">${cp.map(progCard).join('')}</div>

        <h2 class="section-title">Тренування на тренажерах</h2>
        <p class="section-sub">Окремі тренування на групу м’язів</p>
        <div class="prog-list">${singles.map(progCard).join('')}</div>

        <h2 class="section-title">Спліти</h2>
        <div class="prog-list">${splits.map(progCard).join('')}</div>

        <details class="tech"><summary>Техніки інтенсивності</summary>
          <dl>${Object.values(TECH).map(t => `<div><dt>${t.name}</dt><dd>${t.text}</dd></div>`).join('')}</dl>
        </details>`
    };
  },

  program(r) {
    const p = progById[r.id];
    if (p.type !== 'workout') return planScreen(p);
    const cp = !!p.inspiredBy;
    const items = progItems(p);
    const src = progSource(p);
    return {
      head: topbar({ title: p.title, back: true, action: favBtn(p.id, true) }),
      body: `
        <p class="section-sub" style="margin-top:8px">${esc(p.focus)}</p>
        ${cp ? `<div class="disclaimer-box">${ICON.info}<span>${CP_NOTE}<br>Натхнення: ${esc(p.inspiredBy)}.</span></div>` : ''}
        ${cp ? `<section class="block src-box">
          <h3 class="block-title">${ICON.video} Відео-джерело</h3>
          <label class="field"><span>Посилання на відео (заповнюєш сам)</span>
            <input id="srcUrl" type="url" inputmode="url" placeholder="https://www.youtube.com/watch?v=…" value="${esc(src)}" autocomplete="off">
            <small id="srcErr" hidden>Посилання має починатися з http:// або https://</small>
          </label>
          <div class="row">
            ${validUrl(src) ? `<a class="btn small secondary" href="${esc(src)}" target="_blank" rel="noopener noreferrer">${ICON.link} Відкрити відео</a>` : ''}
            <label class="check"><input type="checkbox" data-act="prog-verified" ${progVerified(p) ? 'checked' : ''}> Комплекс звірено з відео</label>
          </div>
        </section>` : ''}
        <section class="block">
          <h3 class="block-title">${ICON.steps} Вправи · ${items.length}</h3>
          <div class="item-list">${items.map((it, i) => itemHtml(p, it, i, cp)).join('')}</div>
        </section>
        ${!p.addon ? `<label class="check" style="margin-top:14px"><input type="checkbox" data-act="toggle-vacuum" ${state.addVacuum ? 'checked' : ''}> Додати вакуум живота в кінці</label>` : ''}
        <button class="btn secondary" style="margin-top:12px" data-act="my-from-prog" data-id="${p.id}">${ICON.plus} Зберегти як моє тренування</button>
        <div class="sticky-cta"><a class="btn" href="#/run/${p.id}" data-act="run-start" data-id="${p.id}">${ICON.play} Почати тренування</a></div>`,
      after() {
        const inp = $('#srcUrl');
        if (inp) inp.addEventListener('change', () => {
          const v = inp.value.trim();
          const bad = v && !validUrl(v);
          $('#srcErr').hidden = !bad;
          if (bad) return;
          progEdit(p.id).sourceUrl = v;
          saveState();
          render(true);
        });
      }
    };
  },

  run(r) {
    const p = progById[r.id];
    if (!run || run.pid !== p.id) startRun(p);
    if (run.done) {
      return {
        head: topbar({ title: p.title, back: true }),
        body: `<div class="done-card" style="margin-top:12px">${ICON.trophy}<h2>Тренування завершено!</h2>
          <p>${run.items.length} ${exWord(run.items.length)} · ${run.items.reduce((s, it) => s + it.sets, 0)} ${setWord(run.items.reduce((s, it) => s + it.sets, 0))}</p>
          ${!run.items.some(it => it.exerciseId === 'stomach-vacuum') ? `<button class="btn secondary" data-act="run-add-vacuum">Додати вакуум живота</button>` : ''}
          <button class="btn" data-act="run-exit">Готово</button></div>`
      };
    }
    const it = run.items[run.idx];
    const e = byId[it.exerciseId];
    const cfg = runCfg(p, it, run.idx);
    ui.cfg = cfg;
    const pct = Math.round(run.idx / run.items.length * 100);
    return {
      head: topbar({ title: p.title, back: true }),
      body: `
        <div class="run-progress"><span>Вправа ${run.idx + 1} з ${run.items.length}</span><span class="run-bar"><i style="width:${pct}%"></i></span></div>
        ${mediaHtml(e)}
        <div class="ex-head">
          <h2>${esc(e.name)}</h2>
          <p class="aka">${esc(e.aka || '')}</p>
          <div class="item-target" style="font-size:18px">${it.sets} × ${esc(it.reps)} <span>· відпочинок ${fmtRest(it.rest)}</span></div>
          <div class="badges" style="margin-top:8px">${itemBadges(it, !!p.inspiredBy)}</div>
          ${it.technique ? `<p class="hint">${ICON.fire}<span><b>${TECH[it.technique].name}.</b> ${TECH[it.technique].text}</span></p>` : ''}
          ${it.note ? `<p class="note-box">${esc(it.note)}</p>` : ''}
        </div>
        <section class="block tracker" id="tracker">${trackerHtml(cfg)}</section>
        <div class="run-nav">
          <button class="btn secondary" data-act="run-prev" ${run.idx === 0 ? 'disabled' : ''}>${ICON.back} Попередня</button>
          <button class="btn secondary" data-act="run-next">${run.idx === run.items.length - 1 ? 'Завершити' : 'Наступна'} ${ICON.chev}</button>
        </div>
        <a class="row-link" href="#/exercise/${e.id}">${ICON.steps}<span class="grow">Техніка та налаштування тренажера</span>${ICON.chev}</a>`,
      after() { startAnim(); }
    };
  },

  favorites() {
    const ex = state.favs.map(id => byId[id]).filter(Boolean);
    const pr = state.favPrograms.map(id => progById[id]).filter(Boolean);
    if (!ex.length && !pr.length) {
      return {
        head: topbar({ title: 'Обране' }),
        body: `<div class="empty">${ICON.star}<b>Поки що порожньо</b>Торкнись зірочки на вправі або комплексі, щоб зберегти їх тут.<br><a class="btn" href="#/${state.place}/all">Переглянути вправи</a></div>`
      };
    }
    return {
      head: topbar({ title: 'Обране' }),
      body: `
        ${pr.length ? `<h2 class="section-title">Комплекси</h2><div class="prog-list">${pr.map(progCard).join('')}</div>` : ''}
        ${ex.length ? `<h2 class="section-title">Вправи</h2>
          <button class="row-link today" data-act="my-from-favs">${ICON.plus}<span class="grow">Зібрати тренування з обраного<small>${ex.length} ${exWord(ex.length)} → шаблон у «Мої тренування»</small></span>${ICON.chev}</button>
          <div class="ex-list" style="margin-top:12px">${ex.map(e => exCard(e, true)).join('')}</div>` : ''}`
    };
  }
};

function planScreen(p) {
  const today = todayIdx();
  const isWeek = p.type === 'week';
  return {
    head: topbar({ title: p.title, back: true, action: favBtn(p.id, true) }),
    body: `
      <p class="section-sub" style="margin-top:8px">${esc(p.focus)}</p>
      ${p.inspiredBy ? `<div class="disclaimer-box">${ICON.info}<span>${CP_NOTE}<br>Натхнення: ${esc(p.inspiredBy)}.</span></div>` : ''}
      <section class="block"><div class="day-list">
        ${p.days.map((d, i) => `<div class="day ${isWeek && i === today ? 'today' : ''}">
          <span class="day-name">${esc(isWeek ? d.label : String(i + 1))}</span>
          <div class="day-body"><b>${esc(d.title)}</b>
            ${d.workouts.length ? `<div class="day-links">${d.workouts.map(w => `<a class="btn small ${isWeek && i === today ? '' : 'secondary'}" href="#/program/${w}">${esc(progById[w].title)}</a>`).join('')}</div>` : '<span>Відновлення: сон, їжа, легка активність</span>'}
          </div></div>`).join('')}
      </div></section>
      ${isWeek ? `<button class="btn" style="margin-top:16px" data-act="start-week">${ICON.play} Почати тиждень</button>
        ${ui.weekMsg ? `<p class="note-box">${ui.weekMsg}</p>` : ''}` : ''}`
  };
}
function itemBadges(it, cp) {
  const b = [];
  if (it.technique === 'warmup') b.push(`<span class="badge warm">Розминка</span>`);

  if (it.exerciseId !== it.originalId) b.push(`<span class="badge swap">${ICON.swap}Замінено</span>`);
  return b.join('');
}
function itemHtml(p, it, i, cp) {

function updateResults() {
  const r = route;
  const q = norm(ui.q.trim());
  const list = EXERCISES.filter(e =>
    e.place.includes(r.place) &&
    (r.group === 'all' || e.muscleGroup === r.group) &&
    (!r.sub || e.subgroup === r.sub) &&
    (ui.eq === 'all' || e.equipment === ui.eq) &&
    (ui.lvl === 'all' || e.level === ui.lvl) &&
    (ui.type === 'all' || e.type === ui.type) &&
    (!ui.machinesOnly || r.place !== 'gym' || isMachine(e)) &&
    (!q || norm([e.name, e.aka || '', ...e.primaryMuscles, ...e.secondaryMuscles, EQUIP[e.equipment].name, groupById[e.muscleGroup].name, subName(e)].join(' ')).includes(q))
  ).sort((a, b) => (r.place === 'gym' ? isMachine(b) - isMachine(a) : 0));
  $('#count').textContent = `Знайдено ${list.length} ${exWord(list.length)}` + (r.place === 'gym' ? ` · ${list.filter(isMachine).length} на тренажерах і блоках` : '');
  $('#results').innerHTML = list.length
    ? list.map(e => exCard(e, r.group === 'all' || !r.sub)).join('')
    : `<div class="empty">${ICON.search}<b>Нічого не знайдено</b>Спробуй змінити пошук або фільтри.</div>`;

function render(keepScroll) {
  const y = window.scrollY;
  route = parseRoute();
  stopAnim();
  ui.cfg = null;
  if (route.place && route.place !== state.place) { state.place = route.place; saveState(); }
  const scr = route.name === 'program' ? SCREENS.program(route) : SCREENS[route.name](route);
  $('#app').innerHTML = scr.head + `<main class="screen">${scr.body}</main>`;
  if (scr.after) scr.after();
